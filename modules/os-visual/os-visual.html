<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>操作系统 · 看图速成｜调度 · PV · 位示图</title>
<style>
:root {
  --bg: #f2f5fb;
  --bg-glow-1: rgba(72, 112, 230, .13);
  --bg-glow-2: rgba(32, 178, 170, .10);
  --panel: #ffffff;
  --panel-2: #f7f9fd;
  --panel-3: #eef3fb;
  --text: #172033;
  --muted: #5a6a83;
  --faint: #8a99b0;
  --border: #dce4f1;
  --border-strong: #c7d3e6;
  --accent: #3567e8;
  --accent-2: #6d8fff;
  --accent-soft: #e8efff;
  --accent-ink: #1e47b8;
  --ok: #15865a;
  --ok-soft: #e1f6ec;
  --warn: #a96b09;
  --warn-soft: #fff2d9;
  --danger: #cf3543;
  --danger-soft: #ffe9eb;
  --shadow: 0 14px 40px rgba(28, 49, 94, .09);
  --shadow-sm: 0 4px 14px rgba(28, 49, 94, .07);
  --radius: 18px;
  --radius-sm: 12px;
  --p1: #3b6df6;
  --p2: #e07b2a;
  --p3: #1a9d67;
  --p4: #8b5cf6;
  --p5: #d94f70;
  --p6: #0e93a3;
  --p7: #b28b00;
  --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, "Courier New", monospace;
}
[data-theme="dark"] {
  --bg: #0b111c;
  --bg-glow-1: rgba(76, 118, 255, .16);
  --bg-glow-2: rgba(24, 166, 160, .10);
  --panel: #131b29;
  --panel-2: #182233;
  --panel-3: #1d2a3e;
  --text: #e9effb;
  --muted: #9fadc5;
  --faint: #71819b;
  --border: #283549;
  --border-strong: #364761;
  --accent: #7d9dff;
  --accent-2: #a4b9ff;
  --accent-soft: #1c2a46;
  --accent-ink: #b9c9ff;
  --ok: #4bcb94;
  --ok-soft: #113228;
  --warn: #e4a84e;
  --warn-soft: #352715;
  --danger: #ff7b86;
  --danger-soft: #3a191f;
  --shadow: 0 16px 44px rgba(0, 0, 0, .35);
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, .25);
  --p1: #6f97ff;
  --p2: #f0a05a;
  --p3: #43c08f;
  --p4: #a98bff;
  --p5: #f27791;
  --p6: #3fb9c7;
  --p7: #d4b23e;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(900px 500px at 8% -4%, var(--bg-glow-1), transparent 62%),
    radial-gradient(800px 460px at 96% 4%, var(--bg-glow-2), transparent 60%),
    var(--bg);
  min-height: 100vh;
  line-height: 1.6;
}
button, select { font-family: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
b, strong { font-weight: 700; }

.site {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

/* ---------- 顶部 ---------- */
.top {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
}
.top-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 10px 20px 0;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 2px 0 10px;
}
.logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: linear-gradient(145deg, var(--accent), #7d5cf0);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: .5px;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent);
  flex: 0 0 auto;
}
.brand-text h1 {
  font-size: clamp(17px, 2.1vw, 21px);
  letter-spacing: .2px;
}
.brand-text p {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 1px;
}
.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
  transition: .18s ease;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 0;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 14.5px;
  font-weight: 600;
  padding: 11px 16px 12px;
  white-space: nowrap;
  border-radius: 10px 10px 0 0;
  transition: .18s ease;
}
.tab:hover { color: var(--text); background: color-mix(in srgb, var(--panel) 60%, transparent); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); background: color-mix(in srgb, var(--panel) 75%, transparent); }

/* ---------- 面板 ---------- */
.tab-panel { display: none; padding-top: 22px; }
.tab-panel.active { display: block; animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.player {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.scene-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  scrollbar-width: thin;
}
.scene-chip {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 12.5px;
  font-weight: 600;
  transition: .18s ease;
  white-space: nowrap;
}
.scene-chip b { color: var(--faint); font-weight: 700; margin-right: 5px; font-variant-numeric: tabular-nums; }
.scene-chip:hover { border-color: var(--accent-2); color: var(--text); }
.scene-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent);
}
.scene-chip.active b { color: rgba(255,255,255,.72); }

.stage {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.stage-head {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel-2) 65%, transparent), transparent);
}
.scene-kicker {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .8px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.stage-head h2 {
  font-size: clamp(18px, 2.2vw, 23px);
  line-height: 1.35;
  letter-spacing: .1px;
}
.step-count {
  margin-left: auto;
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--muted);
  background: var(--panel-3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 10px;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.stage-body {
  padding: 24px;
  min-height: 415px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.subtitle {
  border-top: 1px dashed var(--border);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 32%, transparent), color-mix(in srgb, var(--accent-soft) 62%, transparent));
  padding: 16px 24px;
  min-height: 76px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: clamp(16.5px, 1.55vw, 20px);
  font-weight: 600;
  line-height: 1.62;
  color: var(--text);
}
.subtitle::before {
  content: "";
  width: 4px;
  align-self: stretch;
  min-height: 26px;
  border-radius: 4px;
  background: var(--accent);
  flex: 0 0 auto;
}
.progress {
  height: 5px;
  background: var(--panel-3);
  border-radius: 99px;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 99px;
  transition: width .35s ease;
}
.controls {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  padding: 2px 0;
}
.btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 11px;
  padding: 9px 15px;
  font-size: 13.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: var(--shadow-sm);
  transition: .16s ease;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent-2); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  min-width: 88px;
  justify-content: center;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent);
}
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.ghost { box-shadow: none; background: transparent; }
.speed {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 3px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
}
.speed button {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.speed button.active { background: var(--accent-soft); color: var(--accent-ink); }
.jump {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}
.jump select {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  padding: 8px 10px;
  font-size: 12.5px;
  max-width: 230px;
}

/* ---------- 通用视觉 ---------- */
.viz { width: 100%; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 7px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.spacer { flex: 1; }
.wrap { flex-wrap: wrap; }
.hidden { display: none !important; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split.wide-left { grid-template-columns: 1.35fr 1fr; }
.split.wide-right { grid-template-columns: 1fr 1.35fr; }
.stack-16 { display: flex; flex-direction: column; gap: 16px; }
.stack-12 { display: flex; flex-direction: column; gap: 12px; }
.stack-10 { display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 15px 17px;
}
.card.plain { background: var(--panel); }
.card.tight { padding: 12px 14px; }
.card h3, .card h4 { font-size: 14.5px; margin-bottom: 6px; }
.card p { font-size: 13.5px; color: var(--muted); }

.term {
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--border));
  border-left: 4px solid var(--accent);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13.5px;
  color: var(--text);
}
.term b { color: var(--accent-ink); }
.warn-box {
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 28%, var(--border));
  border-left: 4px solid var(--warn);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13.5px;
}
.danger-box {
  background: var(--danger-soft);
  border: 1px solid color-mix(in srgb, var(--danger) 28%, var(--border));
  border-left: 4px solid var(--danger);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13.5px;
}
.ok-box {
  background: var(--ok-soft);
  border: 1px solid color-mix(in srgb, var(--ok) 28%, var(--border));
  border-left: 4px solid var(--ok);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 13.5px;
}
.formula {
  font-family: var(--mono);
  font-size: 14px;
  background: var(--panel);
  border: 1px dashed var(--border-strong);
  border-radius: 9px;
  padding: 9px 12px;
  color: var(--text);
  line-height: 1.75;
}
.formula .hl { color: var(--accent); font-weight: 700; }
.big-num {
  font-size: clamp(30px, 5vw, 46px);
  font-weight: 800;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.chip b { color: var(--text); }
.chip.accent { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: var(--accent-soft); color: var(--accent-ink); }
.chip.ok { border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); background: var(--ok-soft); color: var(--ok); }
.chip.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--danger-soft); color: var(--danger); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }

.job-chips { display: flex; gap: 9px; flex-wrap: wrap; }
.job-chip {
  --c: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 6px 11px 6px 8px;
  box-shadow: var(--shadow-sm);
  font-size: 12.5px;
}
.job-chip .id {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--c);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
}
.job-chip small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.job-chip .vals { line-height: 1.2; }

.proc {
  --c: var(--p1);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--c);
  color: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 26%, transparent);
  transition: .25s ease;
}
.proc small { font-weight: 500; font-size: 11px; opacity: .9; }
.proc.ghost { background: var(--panel); color: var(--muted); border: 1px dashed var(--border-strong); box-shadow: none; }
.proc.dim { opacity: .38; filter: saturate(.6); }
.proc.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); }
  50% { box-shadow: 0 0 0 7px transparent; }
}

/* ---------- CPU 场景 ---------- */
.cpu-scene { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0 4px; }
.cpu-box {
  width: min(560px, 100%);
  border: 2px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  background: linear-gradient(180deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 45%, var(--panel)));
  border-radius: 16px;
  padding: 12px 16px 15px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.cpu-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent-ink); }
.cpu-slot {
  margin-top: 9px;
  min-height: 74px;
  border-radius: 12px;
  border: 1px dashed var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--panel) 72%, transparent);
  padding: 10px;
  transition: .3s ease;
}
.cpu-slot.busy { border-style: solid; border-color: transparent; background: transparent; }
.cpu-idle { color: var(--faint); font-size: 13px; }
.cpu-task {
  --c: var(--p1);
  width: 100%;
  background: var(--c);
  color: #fff;
  border-radius: 10px;
  padding: 10px 13px;
  text-align: left;
  box-shadow: 0 8px 18px color-mix(in srgb, var(--c) 30%, transparent);
}
.cpu-task .t-top { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.cpu-task .t-top small { margin-left: auto; font-weight: 600; font-size: 11.5px; opacity: .9; }
.cpu-task .t-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.28); margin-top: 9px; overflow: hidden; }
.cpu-task .t-bar i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width .5s ease; }
.queue-box { width: min(660px, 100%); text-align: center; }
.queue-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.queue-row {
  min-height: 62px;
  border: 1px dashed var(--border-strong);
  border-radius: 14px;
  padding: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  background: var(--panel-2);
  transition: .3s ease;
}
.queue-row .head-mark {
  font-size: 11px;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  border-radius: 6px;
  padding: 2px 6px;
  margin-right: 2px;
}
.arrow-down {
  color: var(--accent);
  font-size: 22px;
  line-height: 1;
  animation: bob 1.6s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* ---------- 甘特图 ---------- */
.gantt-outer, .bitmap-outer { width: 100%; }
.scroll-hint { display: none; text-align: center; font-size: 11px; color: var(--faint); margin-top: 2px; }
.gantt-scroll { width: 100%; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
.gantt { position: relative; width: 100%; }
.gantt-marks { position: relative; height: 26px; }
.gantt-lane {
  position: relative;
  height: 62px;
  border-radius: 12px;
  background: var(--panel-3);
  border: 1px solid var(--border);
  overflow: hidden;
}
.gbar {
  position: absolute;
  top: 9px;
  height: 42px;
  border-radius: 8px;
  color: #fff;
  font-size: 12.5px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  white-space: nowrap;
  border: 2px solid transparent;
  transition: opacity .3s ease;
  z-index: 1;
}
.gbar.tiny-bar { border-radius: 5px; }
.gbar.current {
  border-color: #fff;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 38%, transparent);
  z-index: 3;
}
.gbar-tag {
  position: absolute;
  transform: translateX(-50%);
  top: 2px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0 4px;
  line-height: 1.45;
  z-index: 4;
}
.gantt-now {
  position: absolute;
  top: -24px;
  bottom: 0;
  width: 2px;
  background: var(--accent);
  z-index: 5;
  pointer-events: none;
}
.gantt-now::after {
  content: "";
  position: absolute;
  bottom: -1px; left: 50%;
  transform: translateX(-50%);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.gantt-now-label {
  position: absolute;
  transform: translateX(-50%);
  top: 0;
  font-size: 10.5px;
  font-weight: 800;
  color: #fff;
  background: var(--accent);
  border-radius: 5px;
  padding: 0 5px;
  line-height: 1.5;
  z-index: 6;
}
.gantt-preempt {
  position: absolute;
  transform: translateX(-50%);
  top: 0;
  z-index: 7;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}
.gantt-preempt .bolt {
  color: var(--danger);
  font-size: 15px;
  font-weight: 900;
}
.gantt-preempt .tag {
  font-size: 9.5px;
  color: #fff;
  background: var(--danger);
  border-radius: 4px;
  padding: 0 4px;
  margin-top: 1px;
  white-space: nowrap;
}
.gantt-axis { position: relative; height: 25px; margin-top: 3px; }
.tick {
  position: absolute;
  transform: translateX(-50%);
  top: 2px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tick::before {
  content: "";
  position: absolute;
  top: -5px; left: 50%;
  width: 1px; height: 4px;
  background: var(--border-strong);
}
.tick.last { transform: translateX(-100%); }
.tick.first { transform: none; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12.8px; min-width: 520px; }
.data-table th, .data-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.data-table th { background: var(--panel-3); color: var(--muted); font-weight: 700; font-size: 11.5px; letter-spacing: .2px; white-space: nowrap; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table td.id-cell { font-weight: 800; }
.data-table tr.avg-row td { background: var(--accent-soft); font-weight: 800; color: var(--accent-ink); }
.data-table tr.best td { background: var(--ok-soft); }
.data-table td .pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- 指标卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 13px;
  text-align: center;
}
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 24px; font-weight: 800; line-height: 1.25; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.stat .u { font-size: 11px; color: var(--faint); }
.stat.ok .v { color: var(--ok); }
.stat.warn .v { color: var(--warn); }

/* ---------- 决策卡 ---------- */
.decision-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px 16px;
}
.decision-time {
  font-size: 26px;
  font-weight: 800;
  color: var(--accent-ink);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-align: center;
}
.decision-time small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-top: 3px; }
.decision-body { min-width: 0; }
.decision-body .d-title { font-weight: 800; font-size: 15px; }
.decision-body .d-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.decision-verdict {
  font-weight: 800;
  font-size: 14px;
  padding: 7px 12px;
  border-radius: 9px;
  white-space: nowrap;
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.decision-verdict.preempt { background: var(--danger-soft); color: var(--danger); }
.decision-verdict.keep { background: var(--ok-soft); color: var(--ok); }
.history { display: flex; gap: 6px; flex-wrap: wrap; }
.history .hchip {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--panel-3);
  color: var(--muted);
  border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.history .hchip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.history .hchip.preempt { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--border)); }
.history .hchip.preempt.active { background: var(--danger); color: #fff; }

/* ---------- 代码 ---------- */
.code {
  font-family: var(--mono);
  font-size: 12.8px;
  line-height: 1.85;
  background: #0e1727;
  color: #d8e3fb;
  border: 1px solid #24324a;
  border-radius: 12px;
  padding: 12px 10px;
  overflow-x: auto;
  tab-size: 2;
}
.code-line { padding: 1px 9px; border-radius: 6px; white-space: pre; transition: .2s ease; min-height: 1.85em; }
.code-line.active { background: rgba(124, 157, 255, .22); box-shadow: inset 3px 0 0 #8daaff; color: #fff; }
.code-line .cmt { color: #7e93b8; }
.code-line .kw { color: #9db9ff; }
.code-title { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .5px; margin-bottom: 5px; }
code.inline {
  font-family: var(--mono);
  background: var(--panel-3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 5px;
  font-size: .92em;
}

/* ---------- 信号量 ---------- */
.sem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sem-grid.four { grid-template-columns: repeat(4, 1fr); }
.sem-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 13px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.sem-card .name { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 700; }
.sem-card .val {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
  transition: .25s ease;
}
.sem-card .val.zero { color: var(--warn); }
.sem-card .val.neg { color: var(--danger); }
.sem-card .sub { font-size: 10.5px; color: var(--faint); }
.sem-card.bump { animation: semBump .45s ease; }
@keyframes semBump { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.sem-big-wrap { text-align: center; padding: 6px 0 2px; }
.sem-big {
  font-size: clamp(52px, 10vw, 82px);
  font-weight: 900;
  line-height: 1;
  color: var(--accent-ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.03em;
}
.sem-big.zero { color: var(--warn); }
.sem-big.neg { color: var(--danger); }
.sem-big.bump { animation: bigBump .45s ease; }
@keyframes bigBump { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
.wait-queue {
  min-height: 48px;
  border: 1px dashed var(--danger);
  background: color-mix(in srgb, var(--danger-soft) 60%, var(--panel));
  border-radius: 10px;
  padding: 8px 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--danger);
}
.proc-state {
  --c: var(--p1);
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 92px;
  text-align: center;
  transition: .25s ease;
}
.proc-state .pid { font-weight: 800; font-size: 13px; }
.proc-state .st { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.proc-state.run { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.proc-state.run .st { color: var(--ok); font-weight: 700; }
.proc-state.block { border-color: var(--danger); background: var(--danger-soft); }
.proc-state.block .st { color: var(--danger); font-weight: 700; }
.proc-state.done { opacity: .5; }

/* ---------- 缓冲区 ---------- */
.buffer {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 12px;
  border: 1px dashed var(--border-strong);
  border-radius: 14px;
  background: var(--panel-2);
}
.slot {
  height: 86px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10.5px;
  color: var(--faint);
  transition: .3s ease;
  min-width: 0;
}
.slot .pidx { font-size: 9.5px; color: var(--faint); }
.slot.filled {
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 800;
  font-size: 12px;
}
.slot.filled .pidx { color: var(--accent-ink); opacity: .7; }
.slot.just { animation: slotPop .5s ease; }
@keyframes slotPop { 0% { transform: scale(.86); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.slot .prod { font-size: 15px; line-height: 1; }

/* ---------- 桥 ---------- */
.bridge-scene {
  position: relative;
  height: 190px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  overflow: hidden;
}
.bank {
  position: absolute;
  top: 0; bottom: 0;
  width: 18%;
  background: color-mix(in srgb, var(--panel-3) 75%, transparent);
}
.bank.left { left: 0; border-right: 1px dashed var(--border-strong); }
.bank.right { right: 0; border-left: 1px dashed var(--border-strong); }
.bank-label { position: absolute; bottom: 8px; font-size: 11px; color: var(--muted); width: 100%; text-align: center; }
.bridge-deck {
  position: absolute;
  left: 18%; right: 18%;
  top: 64px;
  height: 62px;
  background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 16%, var(--panel)) 0 14px, color-mix(in srgb, var(--accent) 8%, var(--panel)) 14px 28px);
  border-top: 2px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-bottom: 2px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  border-radius: 6px;
}
.bridge-deck .deck-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 11px;
  letter-spacing: 3px;
  color: color-mix(in srgb, var(--accent) 55%, var(--muted));
  pointer-events: none;
}
.person {
  --c: var(--p1);
  position: absolute;
  left: 5%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  display: grid;
  place-items: center;
  box-shadow: 0 5px 12px color-mix(in srgb, var(--c) 35%, transparent);
  transition: left 1.1s cubic-bezier(.4,.05,.2,1), top .5s ease;
  z-index: 4;
}
.person.blocked { box-shadow: 0 0 0 4px var(--danger-soft), 0 0 0 6px color-mix(in srgb, var(--danger) 45%, transparent); animation: shake 1.4s ease infinite; }
.person.done { opacity: .45; }
.person .badge {
  position: absolute;
  top: -9px; right: -10px;
  background: var(--danger);
  color: #fff;
  font-size: 9px;
  border-radius: 99px;
  padding: 1px 5px;
  white-space: nowrap;
}
@keyframes shake { 0%,100% { transform: translate(-50%,-50%); } 25% { transform: translate(calc(-50% - 2px),-50%); } 75% { transform: translate(calc(-50% + 2px),-50%); } }
.on-bridge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }

/* ---------- 前趋图/哲学家 ---------- */
.svg-wrap { width: 100%; overflow-x: auto; }
.svg-wrap svg { display: block; width: 100%; height: auto; min-width: 460px; max-width: 720px; margin: 0 auto; }
.svg-wrap.narrow svg { min-width: 340px; max-width: 460px; }
.node-rect { fill: var(--panel); stroke: var(--border-strong); stroke-width: 2; transition: .3s ease; }
.node-rect.active { fill: var(--accent); stroke: var(--accent); }
.node-text { fill: var(--text); font-weight: 800; font-size: 16px; font-family: var(--font); transition: .3s ease; }
.node-text.active { fill: #fff; }
.edge { stroke: var(--border-strong); stroke-width: 2; fill: none; transition: .3s ease; }
.edge.lit { stroke: var(--accent); stroke-width: 3; }
.edge.lit.danger { stroke: var(--danger); }
.edge-label { fill: var(--muted); font-size: 12px; font-weight: 700; font-family: var(--mono); }
.edge-label.lit { fill: var(--accent-ink); }

/* ---------- 位示图 ---------- */
.bitmap-scroll { overflow-x: auto; padding-bottom: 4px; }
.bitmap { display: grid; grid-template-columns: 34px repeat(16, minmax(20px, 1fr)); gap: 4px; min-width: 560px; }
.bm-corner { }
.bm-col, .bm-row {
  font-size: 10px;
  color: var(--faint);
  display: grid;
  place-items: center;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.bit {
  aspect-ratio: 1;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--faint);
  transition: .25s ease;
  min-width: 0;
}
.bit.free { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 22%, var(--border)); color: var(--ok); }
.bit.used { background: color-mix(in srgb, var(--muted) 16%, var(--panel)); color: var(--muted); }
.bit.hl { outline: 3px solid var(--accent); outline-offset: -1px; z-index: 2; background: var(--accent); color: #fff; border-color: var(--accent); }
.bit.changed { animation: bitPop .5s ease; }
@keyframes bitPop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.bit.scan { opacity: .45; }
.bit.found { outline: 3px solid var(--warn); outline-offset: -1px; }

/* ---------- 复盘 ---------- */
.paper {
  background: #fff;
  color: #15213a;
  border: 1px solid #d9e1ef;
  border-radius: 16px;
  padding: clamp(20px, 3vw, 34px);
  box-shadow: var(--shadow);
}
.paper h2 { font-size: 22px; letter-spacing: .3px; margin-bottom: 2px; }
.paper .paper-sub { color: #66748c; font-size: 13px; margin-bottom: 20px; }
.paper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; }
.paper-section { break-inside: avoid; }
.paper h3 { font-size: 14.5px; color: #1c3f9e; margin-bottom: 7px; padding-bottom: 4px; border-bottom: 1px solid #e5ebf6; }
.paper .formula { background: #f6f8fc; border: 1px solid #dfe6f2; color: #17233b; font-size: 13px; }
.paper .formula .hl { color: #1d4ed8; }
.paper .mini-code {
  font-family: var(--mono);
  font-size: 11.8px;
  line-height: 1.72;
  background: #f6f8fc;
  border: 1px solid #dfe6f2;
  border-radius: 8px;
  padding: 9px 11px;
  white-space: pre;
  overflow-x: auto;
  color: #17233b;
}
.paper .mini-code .c { color: #75839b; }
.paper ul { margin: 0; padding-left: 17px; font-size: 12.8px; line-height: 1.85; }
.paper li { margin-bottom: 2px; }
.paper .tagline { font-size: 11.5px; color: #6a7890; margin-top: 5px; }

.quiz-list { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.quiz {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.quiz-head { display: flex; gap: 12px; align-items: flex-start; }
.quiz-num {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 800;
  font-size: 14px;
}
.quiz-q { font-size: 14.5px; font-weight: 600; line-height: 1.7; }
.quiz-q .sub { font-weight: 400; color: var(--muted); font-size: 12.5px; display: block; margin-top: 3px; }
.quiz-actions { margin-top: 10px; padding-left: 46px; }
.quiz-answer {
  margin-top: 12px;
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  animation: fadeUp .3s ease both;
}
.quiz-answer .ans-lead { font-size: 12px; font-weight: 800; color: var(--ok); margin-bottom: 6px; }
.quiz .mini-gantt { margin-top: 9px; }
.quiz .mini-gantt .gantt-lane { height: 42px; }
.quiz .mini-gantt .gbar { top: 6px; height: 30px; font-size: 11px; }
.quiz .mini-gantt .gantt-marks { height: 0; }
.quiz .mini-gantt .gantt-axis { height: 20px; }

/* ---------- 底部 ---------- */
.foot {
  margin-top: 34px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  color: var(--faint);
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- 动画 ---------- */
.fade-in { animation: fadeUp .35s ease both; }
.pop-in { animation: popIn .4s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
.slide-in { animation: slideIn .35s ease both; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

/* ---------- 指标时间轴 ---------- */
.detail-timeline { position: relative; padding: 30px 0 4px; }
.dt-marks { position: relative; height: 30px; }
.dt-mark {
  position: absolute;
  transform: translateX(-50%);
  top: 0;
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
}
.dt-mark::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 19px;
  width: 1px;
  height: 11px;
  background: var(--border-strong);
}
.dt-mark.arrive { color: var(--warn); }
.dt-mark.start { color: var(--accent); }
.dt-mark.done { color: var(--ok); }
.dt-track {
  position: relative;
  height: 56px;
  background: var(--panel-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.dt-span {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 12.5px;
  color: #fff;
}
.dt-span.wait {
  background: repeating-linear-gradient(45deg, #e3a23c, #e3a23c 9px, #efb75e 9px, #efb75e 18px);
  color: #5a3b00;
}
.dt-span.run { background: var(--c, var(--accent)); }
.dt-axis { position: relative; height: 20px; font-size: 11px; color: var(--muted); }
.dt-axis span { position: absolute; transform: translateX(-50%); top: 3px; }
.dt-axis span.last { transform: translateX(-100%); }
.dt-bracket {
  position: relative;
  height: 26px;
  margin-top: 14px;
  border-top: 2px solid var(--accent);
}
.dt-bracket::before, .dt-bracket::after {
  content: "";
  position: absolute;
  top: -2px;
  width: 2px;
  height: 10px;
  background: var(--accent);
}
.dt-bracket::before { left: 0; }
.dt-bracket::after { right: 0; }
.dt-bracket span {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -105%);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--accent-ink);
  white-space: nowrap;
  background: var(--panel);
  padding: 0 6px;
}

/* ---------- 编号列表 ---------- */
.num-list {
  margin: 8px 0 0;
  padding-left: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13.5px;
  line-height: 1.65;
}
.num-list li::marker { color: var(--accent); font-weight: 800; }

/* ---------- 互斥 / 同步示意 ---------- */
.relation-stage {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.room {
  position: relative;
  width: 170px;
  height: 100px;
  border: 2px solid var(--accent);
  border-radius: 12px;
  background: var(--accent-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.room-label {
  position: absolute;
  top: -11px;
  left: 10px;
  background: var(--panel);
  padding: 0 6px;
  font-size: 10.5px;
  color: var(--accent-ink);
  font-weight: 800;
}
.door-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: var(--danger);
}
.lock-icon {
  width: 26px;
  height: 20px;
  border: 2px solid currentColor;
  border-radius: 5px;
  position: relative;
  display: inline-block;
  margin-top: 10px;
}
.lock-icon::before {
  content: "";
  position: absolute;
  left: 5px;
  bottom: 100%;
  width: 12px;

    <span>操作系统期末 · 手算速成</span>

<script>
/* 操作系统可视化页面的计算内核
 * 页面里显示的每一个调度结果、周转时间、信号量数值都来自这里。
 * 在浏览器中挂在 window.OSEngine，在 Node 中挂在 globalThis.OSEngine。
 */
(function (global) {
  'use strict';

  function cloneJobs(jobs) {
    return jobs.map(function (j, i) {
      return { id: j.id, arrival: j.arrival, burst: j.burst, order: i };
    });
  }

  function summarize(jobs, segments) {
    var first = {};
    var last = {};
    segments.forEach(function (s) {
      if (first[s.id] === undefined) first[s.id] = s.start;
      last[s.id] = s.end;
    });
    var rows = jobs.map(function (j) {
      var completion = last[j.id];
      var turnaround = completion - j.arrival;
      var waiting = turnaround - j.burst;
      return {
        id: j.id,
        arrival: j.arrival,
        burst: j.burst,
        start: first[j.id],
        completion: completion,
        turnaround: turnaround,
        waiting: waiting,
        weighted: turnaround / j.burst
      };
    });
    var n = rows.length;
    function avg(key) {
      return rows.reduce(function (s, r) { return s + r[key]; }, 0) / n;
    }
    return {
      rows: rows,
      avgTurnaround: avg('turnaround'),
      avgWeighted: avg('weighted'),
      avgWaiting: avg('waiting')
    };
  }

  /* 非抢占式：FCFS / SJF / HRRN */
  function nonPreemptive(jobs, policy) {
    var list = cloneJobs(jobs);
    var t = 0;
    var done = 0;
    var finished = {};
    var segments = [];
    var decisions = [];

    while (done < list.length) {
      var pending = list.filter(function (j) { return !finished[j.id]; });
      var avail = pending.filter(function (j) { return j.arrival <= t; });
      if (!avail.length) {
        t = Math.min.apply(null, pending.map(function (j) { return j.arrival; }));
        continue;
      }

      var chosen;
      var extra = {};
      if (policy === 'fcfs') {
        chosen = avail.slice().sort(function (a, b) {
          return a.arrival - b.arrival || a.order - b.order;
        })[0];
      } else if (policy === 'sjf') {
        chosen = avail.slice().sort(function (a, b) {
          return a.burst - b.burst || a.arrival - b.arrival || a.order - b.order;
        })[0];
      } else if (policy === 'hrrn') {
        var scored = avail.map(function (j) {
          var wait = t - j.arrival;
          return {
            id: j.id,
            burst: j.burst,
            arrival: j.arrival,
            wait: wait,
            ratio: (wait + j.burst) / j.burst,
            order: j.order
          };
        });
        scored.sort(function (a, b) {
          return b.ratio - a.ratio || a.burst - b.burst || a.order - b.order;
        });
        chosen = avail.filter(function (j) { return j.id === scored[0].id; })[0];
        extra.candidates = scored;
      }

      var candidates = avail.map(function (j) {
        return { id: j.id, burst: j.burst, wait: t - j.arrival };
      });
      if (!extra.candidates) {
        candidates.forEach(function (c) { c.rem = c.burst; });
      }

      decisions.push({
        t: t,
        kind: 'schedule',
        chosen: chosen.id,
        candidates: candidates,
        ratios: extra.candidates || null
      });

      segments.push({ id: chosen.id, start: t, end: t + chosen.burst });
      t += chosen.burst;
      finished[chosen.id] = true;
      done += 1;
    }

    var result = { segments: segments, decisions: decisions };
    var m = summarize(list, segments);
    for (var k in m) result[k] = m[k];
    return result;
  }

  function fcfs(jobs) { return nonPreemptive(jobs, 'fcfs'); }
  function sjf(jobs) { return nonPreemptive(jobs, 'sjf'); }
  function hrrn(jobs) { return nonPreemptive(jobs, 'hrrn'); }

  /* 抢占式短作业优先（最短剩余时间优先 SRTF） */
  function srtf(jobs) {
    var list = cloneJobs(jobs);
    var rem = {};
    var finished = {};
    var completed = 0;
    list.forEach(function (j) { rem[j.id] = j.burst; });

    var t = Math.min.apply(null, list.map(function (j) { return j.arrival; }));
    var running = null;
    var lastCompleted = null;
    var segments = [];
    var decisions = [];
    var guard = 0;

    function readyAt(time, includeRunning) {
      return list
        .filter(function (j) {
          return j.arrival <= time && !finished[j.id] && rem[j.id] > 0;
        })
        .map(function (j) { return { id: j.id, rem: rem[j.id], arrival: j.arrival, order: j.order }; })
        .sort(function (a, b) {
          return a.rem - b.rem || a.arrival - b.arrival || a.order - b.order;
        });
    }

    while (completed < list.length && guard < 1000) {
      guard += 1;
      var arrivalsNow = list.filter(function (j) {
        return j.arrival === t && !finished[j.id];
      });
      var runningRemBefore = running ? rem[running] : null;
      var preempted = null;
      var kind = 'run';
      var chosen = running;

      if (!running) {
        var ready = readyAt(t, false);
        if (!ready.length) {
          var future = list.filter(function (j) { return j.arrival > t; });
          if (!future.length) break;
          t = Math.min.apply(null, future.map(function (j) { return j.arrival; }));
          continue;
        }
        chosen = ready[0].id;
      } else {
        var better = arrivalsNow.filter(function (j) {
          return rem[j.id] < rem[running];
        });
        if (better.length) {
          better.sort(function (a, b) {
            return rem[a.id] - rem[b.id] || a.order - b.order;
          });
          preempted = running;
          chosen = better[0].id;
        }
      }

      if (chosen === null) break;
      running = chosen;

      var makeDecision =
        arrivalsNow.length > 0 ||
        lastCompleted !== null ||
        decisions.length === 0;

      if (makeDecision) {
        if (lastCompleted !== null) kind = 'complete';
        else if (preempted !== null) kind = 'preempt';
        else if (arrivalsNow.length > 0) kind = decisions.length === 0 ? 'start' : 'keep';
        else kind = 'start';

        var readyList = readyAt(t, false);
        decisions.push({
          t: t,
          kind: kind,
          completed: lastCompleted,
          arrivals: arrivalsNow.map(function (j) {
            return { id: j.id, rem: rem[j.id], arrival: j.arrival };
          }),
          runningBefore: preempted || (running ? running : null),
          runningRemBefore: runningRemBefore,
          candidates: readyList,
          chosen: chosen,
          preempted: preempted
        });
      }

      lastCompleted = null;

      var futureArr = list
        .filter(function (j) { return j.arrival > t; })
        .map(function (j) { return j.arrival; });
      var nextArr = futureArr.length ? Math.min.apply(null, futureArr) : Infinity;
      var finishAt = t + rem[chosen];
      var end = Math.min(finishAt, nextArr);
      if (end > t) {
        segments.push({ id: chosen, start: t, end: end });
      }
      rem[chosen] -= end - t;
      t = end;

      if (rem[chosen] === 0) {
        finished[chosen] = true;
        completed += 1;
        lastCompleted = chosen;
        running = null;
      }
    }

    if (lastCompleted !== null) {
      decisions.push({
        t: t,
        kind: 'done',
        completed: lastCompleted,
        arrivals: [],
        candidates: [],
        chosen: null,
        preempted: null
      });
    }

    var result = { segments: segments, decisions: decisions };
    var m = summarize(list, segments);
    for (var k in m) result[k] = m[k];
    return result;
  }

  /* 时间片轮转 */
  function rr(jobs, quantum) {
    var list = cloneJobs(jobs);
    var rem = {};
    list.forEach(function (j) { rem[j.id] = j.burst; });
    var sorted = list.slice().sort(function (a, b) {
      return a.arrival - b.arrival || a.order - b.order;
    });

    var t = Math.min.apply(null, list.map(function (j) { return j.arrival; }));
    var queue = [];
    var idx = 0;
    while (idx < sorted.length && sorted[idx].arrival <= t) {
      queue.push(sorted[idx].id);
      idx += 1;
    }

    var segments = [];
    var trace = [];
    var guard = 0;

    while (queue.length && guard < 1000) {
      guard += 1;
      var id = queue.shift();
      var queueBefore = queue.slice();
      var run = Math.min(quantum, rem[id]);
      var start = t;
      var end = t + run;
      rem[id] -= run;
      t = end;

      var arrived = [];
      while (idx < sorted.length && sorted[idx].arrival <= t) {
        arrived.push(sorted[idx].id);
        idx += 1;
      }

      if (rem[id] > 0) queue.push(id);
      arrived.forEach(function (aid) { queue.push(aid); });

      segments.push({ id: id, start: start, end: end });
      trace.push({
        id: id,
        start: start,
        end: end,
        run: run,
        remAfter: rem[id],
        completed: rem[id] === 0,
        queueBefore: queueBefore,
        queueAfter: queue.slice(),
        arrived: arrived,
        quantum: quantum
      });
    }

    var result = { segments: segments, trace: trace };
    var m = summarize(list, segments);
    for (var k in m) result[k] = m[k];
    return result;
  }

  /* ---------- 信号量小模拟器 ---------- */
  function makeSem(init) {
    return { value: init, waiters: [] };
  }

  function semP(sem, pid) {
    sem.value -= 1;
    if (sem.value < 0) {
      sem.waiters.push(pid);
      return { blocked: true, value: sem.value, woke: null };
    }
    return { blocked: false, value: sem.value, woke: null };
  }

  function semV(sem) {
    sem.value += 1;
    var woke = null;
    if (sem.value <= 0) {
      woke = sem.waiters.length ? sem.waiters.shift() : null;
    }
    return { blocked: false, value: sem.value, woke: woke };
  }

  function semRange(init, processCount) {
    return { min: init - processCount, max: init };
  }

  /* ---------- 位示图 ---------- */
  function posToBlock(i, j, n, base) {
    return base === 0 ? n * i + j : n * (i - 1) + j;
  }

  function blockToPos(b, n, base) {
    if (base === 0) {
      return { i: Math.floor(b / n), j: b % n };
    }
    return { i: Math.floor((b - 1) / n) + 1, j: ((b - 1) % n) + 1 };
  }

  function bitmapWords(blocks, n) {
    return Math.ceil(blocks / n);
  }

  var api = {
    fcfs: fcfs,
    sjf: sjf,
    srtf: srtf,
    rr: rr,
    hrrn: hrrn,
    summarize: summarize,
    makeSem: makeSem,
    semP: semP,
    semV: semV,
    semRange: semRange,
    posToBlock: posToBlock,
    blockToPos: blockToPos,
    bitmapWords: bitmapWords
  };

  global.OSEngine = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 页面公共工具 + 播放器 */
window.OSApp = (function () {
  'use strict';

  var E = window.OSEngine;

  var PALETTE = ['#3b6df6', '#e07b2a', '#1a9d67', '#8b5cf6', '#d94f70', '#0e93a3', '#b28b00'];

  function h(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined && html !== null) e.innerHTML = html;
    return e;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function num(n, digits) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    var d = digits === undefined ? 2 : digits;
    var p = Math.pow(10, d);
    var r = Math.round(n * p) / p;
    return String(r);
  }

  function pct(a, b) {
    return (a / b * 100) + '%';
  }

  function colorMap(jobs) {
    var map = {};
    jobs.forEach(function (j, i) {
      map[j.id] = PALETTE[i % PALETTE.length];
    });
    return map;
  }

  function jobChips(jobs, colors) {
    var wrap = h('div', 'job-chips');
    jobs.forEach(function (j, i) {
      var c = colors ? colors[j.id] : PALETTE[i % PALETTE.length];
      var chip = h('div', 'job-chip');
      chip.style.setProperty('--c', c);
      chip.innerHTML =
        '<span class="id">' + esc(j.id) + '</span>' +
        '<span class="vals"><b>' + esc(j.id) + '</b><small>到达 ' + j.arrival + ' · 运行 ' + j.burst + ' ms</small></span>';
      wrap.appendChild(chip);
    });
    return wrap;
  }

  function legend(jobs, colors) {
    var wrap = h('div', 'legend');
    jobs.forEach(function (j, i) {
      var c = colors ? colors[j.id] : PALETTE[i % PALETTE.length];
      var s = h('span', '', '<i style="background:' + c + '"></i>' + esc(j.id));
      wrap.appendChild(s);
    });
    return wrap;
  }

  /* 甘特图：时间轴严格按比例 */
  function gantt(opts) {
    var total = opts.total;
    var upto = opts.upto === undefined || opts.upto === null ? total : opts.upto;
    var colors = opts.colors || {};
    var now = opts.now;
    var preempts = opts.preempts || [];
    var compact = !!opts.compact;

    var wrap = h('div', 'gantt-scroll');
    var g = h('div', 'gantt');
    g.style.minWidth = Math.max(compact ? 460 : 560, Math.round(total * 32)) + 'px';

    var marks = h('div', 'gantt-marks');
    var lane = h('div', 'gantt-lane');
    var axis = h('div', 'gantt-axis');

    var visible = [];
    (opts.segments || []).forEach(function (s) {
      if (s.start >= upto) return;
      var end = Math.min(s.end, upto);
      if (end <= s.start) return;
      visible.push({ id: s.id, start: s.start, end: end, realEnd: s.end });
    });

    visible.forEach(function (s) {
      var w = (s.end - s.start) / total * 100;
      var bar = h('div', 'gbar');
      bar.style.left = pct(s.start, total);
      bar.style.width = w + '%';
      bar.style.background = colors[s.id] || PALETTE[0];
      if (w < 3.2) bar.classList.add('tiny-bar');
      else bar.textContent = s.id;
      if (now !== null && now !== undefined && s.start <= now && now < s.realEnd) {
        bar.classList.add('current');
      }
      lane.appendChild(bar);

      if (w < 3.2) {
        var tag = h('span', 'gbar-tag', esc(s.id));
        tag.style.left = ((s.start + s.end) / 2 / total * 100) + '%';
        marks.appendChild(tag);
      }
    });

    preempts.forEach(function (t) {
      if (t > upto) return;
      var m = h('div', 'gantt-preempt');
      m.style.left = pct(t, total);
      m.innerHTML = '<span class="bolt">▲</span><span class="tag">抢占</span>';
      marks.appendChild(m);
    });

    if (now !== null && now !== undefined) {
      var line = h('div', 'gantt-now');
      line.style.left = pct(now, total);
      lane.appendChild(line);
      var lab = h('div', 'gantt-now-label', 't=' + now);
      lab.style.left = pct(now, total);
      marks.appendChild(lab);
    }

    var markSet = { 0: true };
    markSet[total] = true;
    (opts.segments || []).forEach(function (s) {
      if (s.start <= total) markSet[s.start] = true;
      if (s.end <= total) markSet[s.end] = true;
    });
    Object.keys(markSet).map(Number).sort(function (a, b) { return a - b; }).forEach(function (t) {
      var tick = h('span', 'tick', String(t));
      tick.style.left = pct(t, total);
      if (t === total) tick.classList.add('last');
      if (t === 0) tick.classList.add('first');
      axis.appendChild(tick);
    });

    g.appendChild(marks);
    g.appendChild(lane);
    g.appendChild(axis);
    wrap.appendChild(g);

    var outer = h('div', 'gantt-outer');
    outer.appendChild(wrap);
    outer.appendChild(h('div', 'scroll-hint', '← 左右滑动查看完整时间轴 →'));
    return outer;
  }

  function ganttBlock(opts) {
    var box = h('div', 'stack-10');
    if (opts.title) {
      var head = h('div', 'row tight');
      head.innerHTML = '<b style="font-size:14px">' + esc(opts.title) + '</b>' +
        (opts.tag ? '<span class="chip accent">' + esc(opts.tag) + '</span>' : '');
      box.appendChild(head);
    }
    box.appendChild(gantt(opts));
    if (opts.jobs) box.appendChild(legend(opts.jobs, opts.colors));
    return box;
  }

  function metricsTable(res, opts) {
    opts = opts || {};
    var colors = opts.colors || {};
    var wrap = h('div', 'table-wrap');
    var table = h('table', 'data-table');
    table.innerHTML =
      '<thead><tr><th>进程</th><th>到达</th><th>运行</th><th>完成</th><th>周转</th><th>带权周转</th><th>等待</th></tr></thead>';
    var tbody = h('tbody');
    res.rows.forEach(function (r) {
      var tr = h('tr');
      var c = colors[r.id] || 'var(--accent)';
      tr.innerHTML =
        '<td class="id-cell"><span class="pdot" style="background:' + c + '"></span>' + esc(r.id) + '</td>' +
        '<td>' + r.arrival + '</td>' +
        '<td>' + r.burst + '</td>' +
        '<td>' + r.completion + '</td>' +
        '<td><b>' + r.turnaround + '</b></td>' +
        '<td>' + num(r.weighted, 3) + '</td>' +
        '<td>' + r.waiting + '</td>';
      tbody.appendChild(tr);
    });
    var avg = h('tr', 'avg-row');
    avg.innerHTML =
      '<td colspan="4">平均</td>' +
      '<td>' + num(res.avgTurnaround, 2) + '</td>' +
      '<td>' + num(res.avgWeighted, 3) + '</td>' +
      '<td>' + num(res.avgWaiting, 2) + '</td>';
    tbody.appendChild(avg);
    table.appendChild(tbody);

  /* ---------------- 2.3 互斥模板 ---------------- */
  var scene23 = {

      function snapshot(extra) {
        var s = {
          mutex: sems.mutex.value,

          mWait: sems.mutex.waiters.slice(),
          eWait: sems.empty.waiters.slice(),
          fWait: sems.full.waiters.slice(),
          buffer: buffer.slice(),
          inP: inP,

          justIn: null,
          justOut: null
        };

      snapshot({ op: 'init' });
      E.semP(sems.empty, '生产者'); snapshot({ op: 'P(empty)' });
      E.semP(sems.mutex, '生产者'); snapshot({ op: 'P(mutex)' });
      seq += 1; buffer[inP] = '产品' + seq; var firstSlot = inP; inP = (inP + 1) % 5;
      snapshot({ op: 'put', justIn: firstSlot });
      E.semV(sems.mutex); snapshot({ op: 'V(mutex)' });
      E.semV(sems.full); snapshot({ op: 'V(full)' });

      // 消费一个

      E.semP(sems.mutex, '消费者'); snapshot({ op: 'C P(mutex)' });
      var taken = buffer[outP];
      buffer[outP] = null;
      var takenSlot = outP;
      outP = (outP + 1) % 5;
      snapshot({ op: 'take', justOut: takenSlot, taken: taken });

  /* ---------------- 2.5 过桥 / 读者写者 ---------------- */
  var scene25 = {
    id: '2.5',
    short: '过桥 / 读者写者',
    title: '过桥问题：第一个上桥的人锁桥，最后一个下桥的人开锁',

      snap({ op: 'L1 in' });
      // 方向1 第2人上桥
      E.semP(Sc1, 'L2'); if (c1 === 0) E.semP(S, 'L2'); c1++; E.semV(Sc1);
      snap({ op: 'L2 in' });
      // 方向2 第1人想上桥
      E.semP(Sc2, 'R1');
      var r1blocked = false;

      if (!r1blocked) { c2++; E.semV(Sc2); }
      snap({ op: 'R1 wait', r1blocked: r1blocked });
      // L1 下桥
      E.semP(Sc1, 'L1'); c1--; if (c1 === 0) E.semV(S); E.semV(Sc1);
      snap({ op: 'L1 out' });
      // L2 下桥 -> 唤醒 R1
      E.semP(Sc1, 'L2'); c1--; if (c1 === 0) E.semV(S); E.semV(Sc1);
      // 被唤醒的 R1 继续：count2++，V(Sc2)（在 P(S) 返回之后）
      c2++;
      E.semV(Sc2);
      snap({ op: 'L2 out, R1 in' });
      // R1 下桥
      E.semP(Sc2, 'R1'); c2--; if (c2 === 0) E.semV(S); E.semV(Sc2);
      snap({ op: 'R1 out' });
      snap({ op: 'summary' });

      function person(id, left, topPx, cls, badge) {

          'if (count==0) P(wmutex);',
          'count++;',
          'V(rmutex);',
          '读;',
          'P(rmutex);',
          'count--;',
          'if (count==0) V(wmutex);',

        add(host, A.box('warn',

      var steps = [
        { sub: '桥的规则：同一方向可以同时过，两个方向不能同时过。第一个上桥的人锁桥，最后一个下桥的人开锁。', duration: 6800, draw: function () { draw(0); } },
        { sub: '方向1 的 L1 上桥：count1 从 ' + states[0].c1 + ' 变 ' + states[1].c1 + '，它是第一个人 → P(S)，S ' + states[0].S + ' → ' + states[1].S + '，把桥锁上。', duration: 6400, draw: function () { draw(1); } },
        { sub: 'L2 也上桥：count1 从 ' + states[1].c1 + ' 变 ' + states[2].c1 + '，它不是第一个，不用再锁桥，直接过。', duration: 6200, draw: function () { draw(2); } },
        { sub: '右岸的 R1 想上桥：count2=' + states[2].c2 + '，它需要 P(S)，但 S 已经被方向1 锁住 → S ' + states[2].S + ' → ' + states[3].S + '，R1 阻塞等桥。', duration: 6800, draw: function () { draw(3); } },
        { sub: 'L1 下桥：count1 ' + states[3].c1 + ' → ' + states[4].c1 + '，还没归零，所以不能开桥。', duration: 5800, draw: function () { draw(4); } },
        { sub: 'L2 下桥：count1 ' + states[4].c1 + ' → ' + states[5].c1 + '，最后一个走 → V(S)，S ' + states[4].S + ' → ' + states[5].S + '，唤醒 R1。', duration: 6400, draw: function () { draw(5); } },
        { sub: 'R1 过桥，count2 ' + states[5].c2 + ' → ' + states[6].c2 + '，最后一个下桥 → V(S)，S ' + states[5].S + ' → ' + states[6].S + '，桥恢复空闲。', duration: 6000, draw: function () { draw(6); } },

        { sub: '读者–写者标准写法：第一个读者锁写者，最后一个读者放开；写者永远是独占。', duration: 7000, draw: readerWriterStep }
      ];

      return { steps: steps };

  /* ---------------- 2.6 前趋图 ---------------- */

  var scene27 = {

      function (ans) {
        var f = h('div', 'formula');
        f.innerHTML =
          '字数 = ⌈2000 ÷ 32⌉ = <span class="hl">' + words + ' 个字</span><br>' +
          '100 = ' + p6.i + ' × 32 + ' + p6.j + ' → 第 ' + p6.i + ' 字第 ' + p6.j + ' 位';
        ans.appendChild(answerLead('答案：' + words + ' 个字；第 ' + p6.i + ' 字第 ' + p6.j + ' 位'));
        ans.appendChild(f);
        ans.appendChild(h('div', 'small muted', '盘块号从 0 数：i = ⌊100 ÷ 32⌋ = 3，j = 100 mod 32 = 4。'));
      }
    ));

    return wrap;
  }

  A.buildReview = function (root) {
    root.innerHTML = '';
    var wrap = h('div', 'stack-16');
    wrap.appendChild(buildPaper());

    var head = h('div', 'stack-10');
    head.style.marginTop = '10px';

;
/* 页面入口：页签、主题、播放器生命周期、键盘 */
(function (A) {
  'use strict';

  var themeBtn = document.getElementById('themeBtn');
  var root = document.documentElement;

  function applyTheme(theme) {
    root.dataset.theme = theme;
    try { localStorage.setItem('os-visual-theme', theme); } catch (e) {}
    themeBtn.textContent = theme === 'dark' ? '浅色' : '深色';
    themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  }

  var saved = null;
  try { saved = localStorage.getItem('os-visual-theme'); } catch (e) {}
  var initialTheme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(initialTheme);

  themeBtn.addEventListener('click', function () {
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  var players = {};
  var activeTab = 'sched';
  var reviewBuilt = false;

  var scenes = {
    sched: A.schedScenes,
    pv: A.pvScenes,
    bitmap: A.bitmapScenes
  };

  var tabButtons = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panels = {
    sched: document.getElementById('panel-sched'),
    pv: document.getElementById('panel-pv'),
    bitmap: document.getElementById('panel-bitmap'),
    review: document.getElementById('panel-review')
  };

  function ensurePlayer(tab) {
    if (tab === 'review') {
      if (!reviewBuilt) {
        A.buildReview(document.getElementById('review-root'));
        reviewBuilt = true;
      }
      return null;
    }
    if (!players[tab]) {
      players[tab] = new A.Player(document.getElementById('player-' + tab), scenes[tab], { baseDuration: 5000 });
    }
    return players[tab];
  }

  function switchTab(tab) {
    if (tab === activeTab) return;
    var oldPlayer = players[activeTab];
    if (oldPlayer) oldPlayer.pause();

    activeTab = tab;
    tabButtons.forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    Object.keys(panels).forEach(function (k) {
      panels[k].classList.toggle('active', k === tab);
    });

    var p = ensurePlayer(tab);
    if (p && p.step < p.steps.length - 1) {
      p.play();
    }
    try {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      window.scrollTo(0, 0);
    }
  }

  tabButtons.forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.dataset.tab); });
  });

  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') {
      if (e.code !== 'Space') return;
    }
    if (activeTab === 'review') return;
    var p = players[activeTab];
    if (!p) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      p.next();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      p.prev();
    } else if (e.code === 'Space') {
      e.preventDefault();
      if (p.playing) p.pause();
      else p.play();
    }
  });

  // 第一个页签默认自动播放
  ensurePlayer('sched');

  // 页面隐藏时暂停，避免后台一直跳
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      Object.keys(players).forEach(function (k) { players[k].pause(); });
    }
  });
})(window.OSApp);

</script>
