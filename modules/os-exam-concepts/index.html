<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="操作系统期末高频概念可视化记忆：进程与线程、死锁、I/O、内存管理、文件、OS 概述，附 36 题综合自测。">
<title>操作系统 · 高频概念图鉴</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='26' font-weight='bold' text-anchor='middle' fill='%23fde68a'%3EOS%3C/text%3E%3C/svg%3E">
<style>/* ============ 基础与主题 ============ */
:root{
  color-scheme: light;
  --bg:#f4f0e6;
  --bg2:#ebe4d6;
  --card:#fffcf5;
  --ink:#20242a;
  --ink2:#5f6874;
  --muted:#8a93a0;
  --line:#ded6c6;
  --line2:#c9bfab;
  --dot:#d9d0bf;
  --accent:#1f4ed8;
  --accent-soft:#dfe6ff;
  --hl:#ffe27a;
  --hl-bg:#fff3c4;
  --stage:#fbf8f0;
  --stage-grid:#eae3d4;
  --ok:#15803d;
  --bad:#b91c1c;
  --warn:#b45309;
  --ok-bg:#e8f6ec;
  --bad-bg:#fdecec;
  --shadow:0 1px 2px rgba(32,36,42,.05), 0 10px 28px rgba(32,36,42,.07);
  --shadow-lg:0 18px 56px rgba(32,36,42,.14);
  --c-proc:#2563eb;
  --c-thread:#0891b2;
  --c-res:#7c3aed;
  --c-ready:#d97706;
  --c-run:#059669;
  --c-block:#e11d48;
  --c-create:#64748b;
  --c-term:#475569;
  --c-mem:#4f46e5;
  --c-seg:#9333ea;
  --c-file:#0284c7;
  --c-disk:#ea580c;
  --c-cpu:#334155;
  --c-buf:#b45309;
  --c-user:#2563eb;
  --c-kernel:#b91c1c;
  --c-ok:#15803d;
  --c-bad:#b91c1c;
  --c-warn:#b45309;
  --c-muted:#94a3b8;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1217;
  --bg2:#121a22;
  --card:#161f29;
  --ink:#e8eef6;
  --ink2:#a7b5c5;
  --muted:#7c8b9c;
  --line:#293746;
  --line2:#3b4c5e;
  --dot:#1e2935;
  --accent:#7aa2ff;
  --accent-soft:#1c2b4a;
  --hl:#6b5300;
  --hl-bg:#2c2405;
  --stage:#101821;
  --stage-grid:#1c2834;
  --ok:#4ade80;
  --bad:#f87171;
  --warn:#fbbf24;
  --ok-bg:#13291b;
  --bad-bg:#2b1517;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.3);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --c-proc:#60a5fa;
  --c-thread:#22d3ee;
  --c-res:#a78bfa;
  --c-ready:#fbbf24;
  --c-run:#34d399;
  --c-block:#fb7185;
  --c-create:#94a3b8;
  --c-term:#cbd5e1;
  --c-mem:#818cf8;
  --c-seg:#c084fc;
  --c-file:#38bdf8;
  --c-disk:#fb923c;
  --c-cpu:#cbd5e1;
  --c-buf:#fbbf24;
  --c-user:#60a5fa;
  --c-kernel:#f87171;
  --c-ok:#4ade80;
  --c-bad:#f87171;
  --c-warn:#fbbf24;
  --c-muted:#64748b;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::selection{background:var(--hl);color:#20242a}
[hidden]{display:none!important}
button,select{font-family:inherit}
button{color:inherit}
a{color:var(--accent)}
.paper{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(circle at 15% 0%, color-mix(in srgb,var(--hl) 16%,transparent) 0, transparent 34%),
    radial-gradient(circle at 88% 10%, color-mix(in srgb,var(--accent) 9%,transparent) 0, transparent 30%),
    radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:auto,auto,20px 20px;
  opacity:.9;
}
.paper::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0,var(--bg) 78%);
}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============ 头部 ============ */
.site-head{max-width:1140px;margin:0 auto;padding:28px 22px 6px}
.head-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:flex-start;gap:16px;min-width:0}
.brand-mark{
  flex:0 0 auto;width:60px;height:60px;border-radius:17px;display:grid;place-items:center;
  background:var(--ink);color:var(--bg);font-family:Georgia,"Times New Roman",serif;
  font-weight:800;font-size:20px;letter-spacing:.04em;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.16);
  transform:rotate(-2deg);
}
.brand-text{min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--warn);
  text-transform:uppercase;
}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--warn);border-radius:2px}
h1{
  margin:3px 0 4px;
  font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  font-size:clamp(27px,3.8vw,42px);
  line-height:1.15;letter-spacing:.015em;font-weight:900;
}
.sub{margin:0;color:var(--ink2);font-size:clamp(13px,1.5vw,15px)}
.theme-btn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.theme-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.theme-ico{font-size:16px;line-height:1}
.head-hint{
  display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0 76px;
}
.head-hint span{
  font-size:12.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);
  padding:4px 10px;border-radius:999px;
}
.head-hint b{color:var(--ink)}

/* ============ 页签 ============ */
.tabs{
  position:sticky;top:0;z-index:40;
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  max-width:1180px;margin:14px auto 0;padding:11px 22px 12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:999px;padding:8px 13px 8px 10px;font-size:13.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .16s ease;
}
.tab .tab-n{
  display:grid;place-items:center;width:21px;height:21px;border-radius:50%;
  background:var(--bg2);color:var(--ink2);font-size:11.5px;font-weight:900;
}
.tab:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.tab.active{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.tab.active .tab-n{background:var(--hl);color:#20242a}

/* ============ 主体 ============ */
.main{max-width:1080px;margin:0 auto;padding:26px 22px 70px}
.card-panel{display:none;animation:panelIn .32s ease both}
.card-panel.active{display:block}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card-hero{
  position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--card) 0%,var(--bg2) 100%);
  padding:26px 28px 24px;box-shadow:var(--shadow);
}
.card-hero::before{
  content:"";position:absolute;right:-46px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:var(--accent-card,var(--c-proc));opacity:.1;
}
.card-hero::after{
  content:"";position:absolute;right:26px;top:26px;width:12px;height:12px;border-radius:50%;
  background:var(--accent-card,var(--c-proc));opacity:.55;box-shadow:-22px 0 0 var(--accent-card,var(--c-proc));
}
.card-no{
  display:inline-block;font-size:12px;font-weight:900;letter-spacing:.14em;
  color:var(--accent-card,var(--c-proc));border-bottom:2px solid currentColor;padding-bottom:2px;
}
.card-hero h2{
  margin:8px 0 8px;font-family:"Songti SC","Noto Serif SC",Georgia,serif;
  font-size:clamp(25px,3.2vw,36px);line-height:1.2;letter-spacing:.01em;
}
.card-hero p{margin:0;color:var(--ink2);font-size:14.5px;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
}
.chip.key{color:var(--accent-card,var(--c-proc));border-color:currentColor;background:transparent}

.sec{margin-top:36px}
.sec-head{display:flex;align-items:center;gap:12px}
.sec-num{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:900;
  box-shadow:3px 3px 0 var(--hl);
}
.sec-head h3{margin:0;font-size:clamp(19px,2.3vw,23px);letter-spacing:.01em}
.sec-desc{margin:5px 0 16px 46px;color:var(--ink2);font-size:13.5px}

/* ============ 动画卡 ============ */
.anim{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:14px 14px 12px;margin-bottom:18px;box-shadow:var(--shadow);
  scroll-margin-top:86px;
}
.anim-head{display:flex;align-items:center;gap:10px;padding:2px 4px 11px;flex-wrap:wrap}
.anim-no{
  flex:0 0 auto;font-size:11.5px;font-weight:900;letter-spacing:.09em;color:var(--ink2);
  border:1px solid var(--line2);border-radius:999px;padding:2px 8px;
}
.anim-head h4{margin:0;font-size:16.5px;line-height:1.35}
.anim-len{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.stage{
  position:relative;background:var(--stage);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;
  background-image:radial-gradient(var(--stage-grid) 1px,transparent 1px);
  background-size:18px 18px;
}
.stage svg{display:block;width:100%;height:auto;font-family:inherit}
.subtitle{
  margin:11px 2px 0;padding:10px 14px;min-height:58px;
  display:flex;align-items:center;
  border-left:4px solid var(--accent);border-radius:0 10px 10px 0;
  background:var(--bg2);
  font-size:clamp(16px,2.15vw,20px);font-weight:800;line-height:1.5;letter-spacing:.01em;
}
.controls{display:flex;align-items:center;gap:7px;padding:12px 2px 2px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:800;line-height:1.2;
  cursor:pointer;transition:all .14s ease;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink2)}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.step-count{font-size:12px;font-weight:800;color:var(--ink2);min-width:46px;text-align:center}
.dots{display:flex;align-items:center;gap:5px;margin-left:auto}
.dot{
  width:8px;height:8px;padding:0;border:0;border-radius:50%;background:var(--line2);
  cursor:pointer;transition:all .16s ease;
}
.dot:hover{background:var(--muted)}
.dot.on{background:var(--accent);transform:scale(1.35)}
.speed{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);font-weight:700;margin-left:2px}
.speed select{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:4px 5px;font-size:12px;font-weight:700;cursor:pointer;
}

/* SVG 内部动画 */
.pop{animation:pop .46s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.fade{animation:fade .5s ease both}
.grow{animation:grow .72s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left center}
.pulse{animation:pulse 1.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.05s ease-in-out infinite}
.slide{animation:slide .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 对比 ============ */
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}
.cmp-col{
  border:1px solid var(--line);border-radius:16px;padding:16px 17px;background:var(--card);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.cmp-col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.cmp-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.cmp-icon{flex:0 0 auto;width:50px;height:50px;display:grid;place-items:center;background:var(--bg2);border-radius:13px}
.cmp-icon svg{width:38px;height:38px}
.cmp-top h4{margin:0;font-size:17px;color:var(--cc)}
.cmp-top span{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:.03em}
.cmp-col ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.cmp-col li{font-size:13.5px;line-height:1.55}
.cmp-col li::marker{color:var(--cc)}
.facts{display:grid;gap:7px;margin-top:13px}
.fact{
  display:flex;align-items:flex-start;gap:9px;
  border:1px solid var(--line);border-left:4px solid var(--line2);
  border-radius:10px;padding:9px 11px;background:var(--card);
}
.fact.ok{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 72%,var(--card))}
.fact.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 72%,var(--card))}
.fact.bad{border-style:dashed;border-left-style:solid}
.fact-ico{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:900;color:#fff;margin-top:1px;
}
.fact.ok .fact-ico{background:var(--ok)}
.fact.bad .fact-ico{background:var(--bad)}
.fact-text{font-size:13.5px;font-weight:600;line-height:1.5;flex:1}
.fact-tag{
  flex:0 0 auto;font-size:10.5px;font-weight:900;letter-spacing:.08em;
  border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-top:1px;
}
.fact.ok .fact-tag{color:var(--ok)}
.fact.bad .fact-tag{color:var(--bad)}

/* ============ 口诀 ============ */
.mnemonic{
  position:relative;border:2px dashed var(--warn);border-radius:20px;
  padding:25px 27px 24px;background:linear-gradient(135deg,var(--hl-bg),var(--card) 72%);
  overflow:hidden;
}
.mnemonic::before{
  content:"“";position:absolute;right:18px;top:-26px;font-family:Georgia,serif;
  font-size:130px;line-height:1;color:var(--warn);opacity:.13;
}
.mn-label{
  display:flex;width:fit-content;align-items:center;gap:7px;font-size:11.5px;font-weight:900;
  letter-spacing:.16em;color:var(--warn);margin-bottom:7px;
}
.mn-label::before{content:"";width:20px;height:2px;background:var(--warn)}
.mnemonic p{
  margin:0;font-size:clamp(21px,3vw,31px);line-height:1.55;font-weight:900;letter-spacing:.03em;
  font-family:"Songti SC","Noto Serif SC",Georgia,serif;
  background:linear-gradient(180deg,transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);
  display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.mnemonic .mn-note{display:block;margin-top:10px;font-size:12.5px;color:var(--ink2);font-weight:600;letter-spacing:0}

/* ============ 小测 ============ */
.quiz{
  border:1px solid var(--line);border-radius:18px;background:var(--card);
  padding:18px 20px 16px;box-shadow:var(--shadow);
}
.quiz-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q-no{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent)}
.q-src{font-size:11px;font-weight:800;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.q-text{margin:11px 0 13px;font-size:clamp(17px,2.1vw,19.5px);font-weight:800;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{
  display:flex;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:11px;background:var(--bg);
  padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45;cursor:pointer;
  transition:border-color .14s ease,background .14s ease,transform .14s ease;
  position:relative;
}
.opt:hover:not(.locked){border-color:var(--accent);transform:translateX(2px)}
.opt .key{
  flex:0 0 auto;width:25px;height:25px;border-radius:7px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:900;color:var(--ink2);
}
.opt .opt-t{flex:1}
.opt .mark{font-size:16px;font-weight:900;display:none}
.opt.locked{cursor:default}
.opt.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.picked .key{border-color:var(--accent);color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .key{border-color:var(--ok);color:var(--ok)}
.opt.correct .mark{display:block;color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{border-color:var(--bad);color:var(--bad)}
.opt.wrong .mark{display:block;color:var(--bad)}
.opt.dim{opacity:.55}
.feedback{
  margin-top:12px;border-radius:11px;padding:11px 13px;border:1px solid var(--line);
  border-left:4px solid var(--line2);background:var(--bg2);
  animation:panelIn .25s ease both;
}
.feedback.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.feedback.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.feedback strong{display:block;font-size:14px;margin-bottom:2px}
.feedback.ok strong{color:var(--ok)}
.feedback.bad strong{color:var(--bad)}
.feedback p{margin:0;font-size:13.5px;line-height:1.55;font-weight:600}
.feedback .ans{font-weight:900}
.quiz-foot{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}
.quiz-score{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:16px;background:var(--bg2);padding:18px;
}
.score-big{
  font-family:Georgia,serif;font-size:50px;font-weight:800;line-height:1;
  color:var(--accent);min-width:92px;text-align:center;
}
.score-big small{font-size:15px;color:var(--ink2);font-weight:700}
.quiz-score h4{margin:0 0 3px;font-size:18px}
.quiz-score p{margin:0;color:var(--ink2);font-size:13px}

/* 双空题 */
.subq{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;margin-top:9px;background:var(--bg)}
.subq-label{font-size:14px;font-weight:800;margin-bottom:8px}
.subq .opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.subq .opt{padding:7px 9px;font-size:13.5px}
.subq .opt .key{width:21px;height:21px;font-size:10.5px}

/* ============ 综合自测 ============ */
.test-shell{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:20px;box-shadow:var(--shadow)}
.test-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.test-top h3{margin:0;font-size:20px}
.test-stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;color:var(--ink2)}
.stat b{color:var(--ink)}
.bar{height:9px;border-radius:999px;background:var(--bg2);overflow:hidden;margin:14px 0 16px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-run));border-radius:999px;transition:width .35s ease}
.test-question{animation:panelIn .25s ease both}
.test-result{animation:panelIn .3s ease both}
.result-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:6px 2px 18px}
.result-score{
  font-family:Georgia,serif;font-size:64px;line-height:1;font-weight:800;color:var(--accent);
}
.result-score small{font-size:18px;color:var(--ink2)}
.result-copy h3{margin:0 0 4px;font-size:22px}
.result-copy p{margin:0;color:var(--ink2);font-size:14px}
.wrong-list{margin-top:16px;display:grid;gap:9px}
.wrong-item{
  border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;
  padding:11px 13px;background:var(--bad-bg);
}
.wrong-item .wi-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.wrong-item .wi-src{font-size:10.5px;font-weight:900;color:var(--bad);letter-spacing:.06em}
.wrong-item .wi-q{font-size:13.5px;font-weight:800;line-height:1.5}
.wrong-item .wi-a{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.55}
.wrong-item .wi-a b{color:var(--ok)}
.wrong-item .wi-b{color:var(--bad)}
.test-empty{text-align:center;padding:26px 10px;color:var(--ink2)}
.test-empty .big{font-size:46px;line-height:1;margin-bottom:8px;color:var(--ok)}
.test-cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.test-cats span{font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;color:var(--ink2)}

/* ============ Toast ============ */
.toast{
  position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(720px,calc(100% - 24px));
  display:flex;align-items:flex-start;gap:11px;
  background:var(--card);border:1px solid var(--line2);border-left:5px solid var(--bad);
  border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-lg);
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-ico{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:14px;margin-top:1px;
}
.toast-body{flex:1;min-width:0}
.toast-body strong{display:block;font-size:13.5px;line-height:1.4}
.toast-body p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.toast-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ============ 页脚 ============ */
.foot{
  max-width:1080px;margin:0 auto;padding:22px 22px 38px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;
}

/* ============ 响应式 ============ */
@media (max-width:760px){
  .site-head{padding:20px 15px 4px}
  .head-inner{gap:12px}
  .brand{gap:11px}
  .brand-mark{width:48px;height:48px;border-radius:13px;font-size:16px}
  .head-hint{margin-left:59px;gap:5px}
  .head-hint span{font-size:11px;padding:3px 8px}
  .theme-btn{padding:7px 10px}
  .theme-txt{display:none}
  .tabs{padding:9px 15px 10px;gap:6px}
  .tab{padding:7px 11px 7px 8px;font-size:12.5px}
  .tab .tab-n{width:19px;height:19px;font-size:10.5px}
  .main{padding:20px 14px 56px}
  .card-hero{padding:20px 18px 19px;border-radius:19px}
  .card-hero::after{right:18px;top:20px}
  .sec-desc{margin-left:0}
  .sec{margin-top:30px}
  .anim{padding:11px 10px 10px;border-radius:16px;scroll-margin-top:76px}
  .anim-head h4{font-size:15.5px}
  .anim-len{display:none}
  .subtitle{font-size:16px;padding:9px 11px;min-height:64px}
  .controls{gap:5px}
  .btn{padding:7px 10px;font-size:12.5px}
  .step-count{font-size:11px;min-width:40px}
  .dots{gap:4px}
  .dot{width:7px;height:7px}
  .speed{margin-left:auto}
  .mnemonic{padding:20px 18px;border-radius:16px}
  .compare{grid-template-columns:1fr}
  .quiz{padding:15px 14px;border-radius:15px}
  .test-shell{padding:15px 14px;border-radius:16px}
  .result-score{font-size:52px}
  .toast{bottom:10px;padding:10px 11px;gap:8px;border-radius:12px}
  .toast-actions{width:100%;justify-content:flex-end}
  .toast{flex-wrap:wrap}
  .toast-body{flex-basis:calc(100% - 40px)}
}
@media (max-width:420px){
  h1{font-size:clamp(19px,5.3vw,21px);letter-spacing:0}
  .sub{font-size:12px}
  .head-hint{display:none}
  .card-hero::after{display:none}
  .brand-mark{width:44px;height:44px}
  .stage{border-radius:11px}
  .opt{font-size:14px;padding:9px 10px}
}
@media (hover:none){
  .btn:hover{transform:none;border-color:var(--line2)}
  .btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .opt:hover:not(.locked){transform:none;border-color:var(--line);background:var(--bg)}
  .opt.picked:hover:not(.locked){border-color:var(--accent);background:var(--accent-soft)}
  .tab:hover{transform:none;border-color:var(--line);color:var(--ink2)}
  .tab.active:hover{color:var(--bg)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>

    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/></marker>
    <marker id="ah-darkblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>

    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0891b2"/></marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>

<script>/* ============================================================
   内容层：SVG 动画、对比、口诀、题库
   ============================================================ */
"use strict";

const SVGC = {
  ink: "var(--ink)", ink2: "var(--ink2)", muted: "var(--c-muted)",
  card: "var(--card)", stage: "var(--stage)",
  proc: "var(--c-proc)", thread: "var(--c-thread)", res: "var(--c-res)",
  ready: "var(--c-ready)", run: "var(--c-run)", block: "var(--c-block)",
  create: "var(--c-create)", term: "var(--c-term)",
  mem: "var(--c-mem)", seg: "var(--c-seg)", file: "var(--c-file)",
  disk: "var(--c-disk)", cpu: "var(--c-cpu)", buf: "var(--c-buf)",
  user: "var(--c-user)", kernel: "var(--c-kernel)",
  ok: "var(--c-ok)", bad: "var(--c-bad)", warn: "var(--c-warn)",
  accent: "var(--accent)", line2: "var(--line2)"
};

/* ---------- SVG 小工具 ---------- */
function tx(x, y, str, o = {}) {
  const s = o.s === undefined ? 16 : o.s;
  const a = o.a || "middle";
  const c = o.c || SVGC.ink;
  const w = o.w === undefined ? 700 : o.w;
  const op = o.op === undefined ? 1 : o.op;
  const ls = o.ls || 0;
  const ff = o.ff ? ` font-family="${o.ff}"` : "";
  return `<text x="${x}" y="${y}" font-size="${s}" text-anchor="${a}" fill="${c}" font-weight="${w}" opacity="${op}" letter-spacing="${ls}"${ff} dominant-baseline="middle">${str}</text>`;
}
function tlines(x, y, lines, o = {}) {
  const lh = o.lh || 22;
  return lines.map((l, i) => tx(x, y + i * lh, l, o)).join("");
}
function box(x, y, w, h, o = {}) {
  const fill = o.fill === undefined ? "none" : o.fill;
  const stroke = o.stroke === undefined ? SVGC.ink2 : o.stroke;
  const sw = o.sw === undefined ? 2 : o.sw;
  const rx = o.rx === undefined ? 12 : o.rx;
  const op = o.op === undefined ? 1 : o.op;
  const dash = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
  const cls = o.cls ? ` class="${o.cls}"` : "";
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"${dash}${cls}/>`;
}
function ln(x1, y1, x2, y2, o = {}) {
  const c = o.c || SVGC.ink2, sw = o.sw || 2, op = o.op === undefined ? 1 : o.op;
  const dash = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}" opacity="${op}"${dash} stroke-linecap="round"/>`;
}
function arrow(x1, y1, x2, y2, o = {}) {
  const key = o.key || "ink";
  const c = o.c || SVGC.ink2;
  const sw = o.sw || 2.4;
  const op = o.op === undefined ? 1 : o.op;
  const dash = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
  const cls = o.cls ? ` class="${o.cls}"` : "";
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}" opacity="${op}"${dash}${cls} stroke-linecap="round" marker-end="url(#ah-${key})"/>`;
}
function parrow(d, o = {}) {
  const key = o.key || "ink";
  const c = o.c || SVGC.ink2;
  const sw = o.sw || 2.4;
  const op = o.op === undefined ? 1 : o.op;
  const dash = o.dash ? ` stroke-dasharray="${o.dash}"` : "";
  const cls = o.cls ? ` class="${o.cls}"` : "";
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" opacity="${op}"${dash}${cls} stroke-linecap="round" marker-end="url(#ah-${key})"/>`;
}
function textWidth(str, size) {
  let w = 0;
  for (const ch of String(str)) {
    w += /[⺀-鿿＀-￯]/.test(ch) ? size : size * 0.6;
  }
  return w;
}
function tag(x, y, text, o = {}) {
  const s = o.s || 12.5;
  const w = textWidth(text, s) + 16;
  const h = s + 11;
  const fill = o.fill || "var(--card)";
  const stroke = o.stroke || SVGC.muted;
  const c = o.c || SVGC.ink;
  return `<g class="fade"><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="1" opacity=".97"/>${tx(x, y + 1, text, { s, c, w: 700 })}</g>`;
}
function mark(x, y, ok, o = {}) {
  const r = o.r || 12;
  const c = o.c || (ok ? SVGC.ok : SVGC.bad);
  return `<g class="pop"><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>${tx(x, y + 1, ok ? "✓" : "✗", { s: r + 2, c: "#fff", w: 900 })}</g>`;
}
function stateNode(x, y, r, label, color, o = {}) {
  const active = !!o.active;
  const dashed = !!o.dashed;
  const sub = o.sub || "";
  const fs = o.fs || (r >= 48 ? 19 : r >= 42 ? 17 : 13);
  return `<g class="${active ? "pop" : ""}">
    <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${active ? 0.18 : 0.07}"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${color}" stroke-width="${active ? 4 : 2.6}" ${dashed ? 'stroke-dasharray="7 6"' : ""}/>
    ${tx(x, y - (sub ? 7 : 0), label, { s: fs, c: color, w: 800 })}
    ${sub ? tx(x, y + 19, sub, { s: 11.5, c: SVGC.ink2, w: 700 }) : ""}
  </g>`;
}
function pillNode(x, y, w, h, label, color, o = {}) {
  const active = !!o.active;
  const sub = o.sub || "";
  return `<g class="${active ? "pop" : ""}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${color}" opacity="${active ? 0.2 : 0.08}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="none" stroke="${color}" stroke-width="${active ? 3.6 : 2.3}"/>
    ${tx(x + w / 2, y + h / 2 - (sub ? 5 : 0), label, { s: o.fs || 14, c: color, w: 800 })}
    ${sub ? tx(x + w / 2, y + h / 2 + 13, sub, { s: 10.5, c: SVGC.ink2, w: 700 }) : ""}
  </g>`;
}
function resSquare(x, y, w, h, label, dots = 1, o = {}) {
  const color = o.c || SVGC.res;
  let dotMarkup = "";
  for (let i = 0; i < dots; i++) {
    const dx = x + w / 2 + (i - (dots - 1) / 2) * 17;
    dotMarkup += `<circle cx="${dx}" cy="${y + h * 0.62}" r="4.5" fill="${color}"/>`;
  }
  return `<g class="${o.active ? "pop" : ""}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${color}" opacity="${o.active ? 0.18 : 0.08}"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="none" stroke="${color}" stroke-width="${o.active ? 3.6 : 2.4}"/>
    ${tx(x + w / 2, y + (dots ? 18 : h / 2), label, { s: 13.5, c: color, w: 800 })}
    ${dotMarkup}
  </g>`;
}
function docShape(x, y, w, h, color, o = {}) {
  const fold = o.fold || 22;
  const lines = o.lines || 3;
  let lm = "";
  for (let i = 0; i < lines; i++) {
    lm += `<path d="M${x + 20},${y + h * 0.42 + i * 18} H${x + w - 22 - (i === lines - 1 ? 28 : 0)}" stroke="${color}" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>`;
  }
  return `<g class="${o.active ? "pop" : ""}">
    <path d="M${x},${y} H${x + w - fold} L${x + w},${y + fold} V${y + h} H${x} Z" fill="var(--card)" stroke="${color}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M${x + w - fold},${y} V${y + fold} H${x + w}" fill="none" stroke="${color}" stroke-width="2.2"/>
    ${lm}
    ${o.label ? tx(x + w / 2, y + h + 22, o.label, { s: o.fs || 14, c: color, w: 800 }) : ""}
  </g>`;
}
function cpuChip(x, y, w, h, label, o = {}) {
  return `<g class="${o.active ? "pop" : ""}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${SVGC.cpu}" opacity=".1"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="none" stroke="${SVGC.cpu}" stroke-width="2.4"/>
    <path d="M${x + w * 0.28},${y} v-7 M${x + w * 0.5},${y} v-7 M${x + w * 0.72},${y} v-7" stroke="${SVGC.cpu}" stroke-width="2" stroke-linecap="round"/>
    <path d="M${x + w * 0.28},${y + h} v7 M${x + w * 0.5},${y + h} v7 M${x + w * 0.72},${y + h} v7" stroke="${SVGC.cpu}" stroke-width="2" stroke-linecap="round"/>
    ${tx(x + w / 2, y + h / 2, label, { s: o.fs || 14, c: SVGC.cpu, w: 900 })}
  </g>`;
}
const FR = (t, svg, d = 3400) => ({ t, svg, d });

/* ============================================================
   卡① 进程与线程
   ============================================================ */

/* ---- 1.1 五状态 ---- */
function stateDiagram(activeEdge, activeNodes) {
  const edges = [
    { id: "admit", d: "M124,110 H187", c: SVGC.create, key: "ink", label: "创建完成", lx: 155, ly: 85 },
    { id: "dispatch", d: "M283,110 H347", c: SVGC.run, key: "green", label: "被调度", lx: 315, ly: 85 },
    { id: "preempt", d: "M378,64 C352,22 292,22 252,64", c: SVGC.ready, key: "amber", label: "时间片到 / 被抢占", lx: 316, ly: 14 },
    { id: "block", d: "M395,158 V237", c: SVGC.block, key: "red", label: "等 I/O 或资源", lx: 500, ly: 198 },
    { id: "wake", d: "M359,262 C300,244 248,208 241,158", c: SVGC.ready, key: "amber", label: "I/O 完成 / 资源到", lx: 291, ly: 238 },
    { id: "exit", d: "M443,110 H526", c: SVGC.term, key: "muted", label: "结束", lx: 485, ly: 85 }
  ];
  let edgeMarkup = "";
  edges.forEach(e => {
    const on = activeEdge === e.id;
    const isPath = e.d.includes("C");
    if (isPath) {
      edgeMarkup += parrow(e.d, {
        c: on ? e.c : SVGC.ink2, key: on ? e.key : "ink",
        sw: on ? 4.2 : 2.2, op: on ? 1 : (activeEdge ? 0.28 : 0.52),
        cls: on ? "draw" : "", dash: ""
      });
    } else {
      edgeMarkup += arrow(
        ...(() => {
          const m = e.d.match(/M([\d.]+),([\d.]+)\s*H([\d.]+)/);
          if (m) return [+m[1], +m[2], +m[3], +m[2]];
          const v = e.d.match(/M([\d.]+),([\d.]+)\s*V([\d.]+)/);
          return [+v[1], +v[2], +v[1], +v[3]];
        })(),
        { c: on ? e.c : SVGC.ink2, key: on ? e.key : "ink", sw: on ? 4.2 : 2.2, op: on ? 1 : (activeEdge ? 0.28 : 0.52), dash: "", cls: on ? "draw" : "" }
      );
    }
  });
  const labels = edges.map(e => tag(e.lx, e.ly, e.label, {
    c: activeEdge === e.id ? e.c : SVGC.ink2,
    stroke: activeEdge === e.id ? e.c : SVGC.muted,
    op: activeEdge === e.id ? 1 : 0.72,
    s: 12
  })).join("");

  const nodes = [
    { x: 80, y: 110, r: 44, label: "创建", c: SVGC.create, id: "create" },
    { x: 235, y: 110, r: 48, label: "就绪", c: SVGC.ready, id: "ready" },
    { x: 395, y: 110, r: 48, label: "运行", c: SVGC.run, id: "run" },
    { x: 395, y: 285, r: 48, label: "阻塞", c: SVGC.block, id: "block" },
    { x: 570, y: 110, r: 44, label: "终止", c: SVGC.term, id: "term" }
  ];
  return `
    <g opacity=".45">${tx(320, 372, "合法转换用实线；不存在的转换在下一步单独标出", { s: 12, c: SVGC.ink2, w: 600 })}</g>
    ${edgeMarkup}
    ${nodes.map(n => stateNode(n.x, n.y, n.r, n.label, n.c, { active: activeNodes.includes(n.id) })).join("")}
    ${labels}`;
}

function miniProc(x, y, label, o = {}) {
  const r = o.r || 26;
  const color = o.color || SVGC.proc;
  const dots = o.dots || 0;
  const active = o.active !== false;
  let dm = "";
  for (let i = 0; i < dots; i++) {
    const dx = x + (i - (dots - 1) / 2) * 12;
    dm += `<circle cx="${dx}" cy="${y + 13}" r="4" fill="${o.dotColor || SVGC.res}"/>`;
  }
  return `<g class="${active ? "pop" : ""}">
    <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity=".08"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${color}" stroke-width="${o.sw || 2.4}"/>
    ${tx(x, y - (dots ? 5 : 0), label, { s: o.fs || 13, c: color, w: 800 })}
    ${dm}
  </g>`;
}
function printerIcon(x, y, s, color = SVGC.res, active = true) {
  return `<g class="${active ? "pop" : ""}">
    <rect x="${x}" y="${y}" width="${s}" height="${s * 0.64}" rx="4" fill="${SVGC.card}" stroke="${color}" stroke-width="2"/>
    <rect x="${x + s * 0.22}" y="${y + s * 0.12}" width="${s * 0.56}" height="${s * 0.22}" rx="2" fill="${color}" opacity=".25" stroke="${color}" stroke-width="1.4"/>

    <rect x="${x + s * 0.18}" y="${y - s * 0.18}" width="${s * 0.64}" height="${s * 0.2}" rx="2" fill="${SVGC.card}" stroke="${color}" stroke-width="1.6"/>
  </g>`;
}

function ragDiagram(stage) {
  const showAlloc = stage >= 3 || stage === 6;

  const edges = [];
  if (showAlloc) {
    edges.push(arrow(300, 130, 204, 175, { c: cA, key: keyA, sw: cycle ? 4 : 2.8 }));
    edges.push(arrow(358, 274, 440, 221, { c: cA, key: keyA, sw: cycle ? 4 : 2.8 }));
  }
  if (showReq) {
    edges.push(arrow(200, 221, 282, 270, { c: cR, key: keyR, sw: cycle ? 4 : 2.8 }));
    edges.push(arrow(443, 165, 345, 118, { c: cR, key: keyR, sw: cycle ? 4 : 2.8 }));

  const labels = [];
  if (stage === 3) {
    labels.push(tag(247, 145, "已分配", { c: SVGC.res, stroke: SVGC.res }));

  if (stage === 4) {

  if (stage === 6) {
    labels.push(tag(250, 143, "已分配 R→P", { c: SVGC.res, stroke: SVGC.res }));
    labels.push(tag(237, 254, "请求 P→R", { c: SVGC.proc, stroke: SVGC.proc }));
    labels.push(tag(404, 133, "请求 P→R", { c: SVGC.proc, stroke: SVGC.proc }));
    labels.push(tag(410, 255, "已分配 R→P", { c: SVGC.res, stroke: SVGC.res }));
  }

  let legend = "";
  if (stage <= 1 || stage === 6) {
    legend = `
      ${stateNode(132, 360, 17, "", SVGC.proc, { active: false })}
      ${tx(156, 360, "进程", { s: 12.5, a: "start", c: SVGC.proc })}
      ${resSquare(246, 346, 32, 28, "", 0)}
      ${tx(286, 360, "资源", { s: 12.5, a: "start", c: SVGC.res })}
      ${arrow(380, 360, 420, 360, { c: SVGC.proc, key: "darkblue", sw: 2.4 })}

  }
  const bottomNote = stage === 2
    ? tag(320, 364, "资源框里的圆点 = 该类资源的实例数（这里各 1 个）", { s: 13, c: SVGC.ink2 })

        ? tag(320, 364, "P → R：进程正在请求这个资源", { s: 13, c: SVGC.proc, stroke: SVGC.proc })
        : "";

  return `
    ${edges.join("")}
    ${stateNode(160, 195, 48, "P1", SVGC.proc, { active: stage === 5 || stage === 6 })}

/* ============================================================

function simplifyDiagram(stage) {
  const showP2 = stage <= 2;
  const showP1 = stage <= 4;
  const showAlloc = stage <= 3;
  const showReq = stage <= 2;
  const showNewAlloc = stage === 4;
  const r2Free = stage >= 3;
  const r1Free = stage >= 5;

  let markup = `
    ${box(112, 46, 102, 64, { fill: "var(--card)", stroke: SVGC.res, sw: 2.4, rx: 8 })}
    ${tx(163, 68, "R1", { s: 14, c: SVGC.res, w: 800 })}
    ${r1Free
      ? `<circle cx="163" cy="92" r="4.5" fill="var(--stage)" stroke="${SVGC.res}" stroke-width="2"/>`
      : `<circle cx="163" cy="92" r="4.5" fill="${SVGC.res}"/>`}
    ${box(406, 136, 102, 64, { fill: "var(--card)", stroke: SVGC.res, sw: 2.4, rx: 8 })}
    ${tx(457, 158, "R2", { s: 14, c: SVGC.res, w: 800 })}
    ${r2Free
      ? `<circle cx="457" cy="182" r="4.5" fill="var(--stage)" stroke="${SVGC.res}" stroke-width="2"/>`
      : `<circle cx="457" cy="182" r="4.5" fill="${SVGC.res}"/>`}
  `;
  if (showAlloc) markup += arrow(163, 110, 175, 134, { c: SVGC.res, key: "purple", sw: 2.8 });
  if (showReq) markup += arrow(221, 174, 404, 170, { c: SVGC.proc, key: "darkblue", sw: 2.8 });
  if (stage <= 2) markup += arrow(457, 200, 480, 254, { c: SVGC.res, key: "purple", sw: 2.8 });
  if (showNewAlloc) markup += arrow(406, 166, 221, 178, { c: SVGC.ok, key: "green", sw: 3.4 });

  if (showP1) {
    markup += stateNode(175, 180, 46, "P1", SVGC.proc, { active: stage === 4 });
    markup += stage === 4 ? tag(178, 238, "P1 已满足", { s: 12, c: SVGC.ok, stroke: SVGC.ok }) : "";
  }
  if (showP2) {
    markup += stateNode(480, 300, 46, "P2", SVGC.proc, { active: stage === 2 });
    markup += stage === 2 ? tag(480, 242, "P2 没有请求", { s: 13, c: SVGC.ok, stroke: SVGC.ok }) : "";
  }
  if (stage === 3) markup += tag(480, 300, "P2 跑完 → 释放 R2", { s: 13, c: SVGC.ok, stroke: SVGC.ok });
  if (stage === 5) {
    markup += tag(320, 200, "所有进程都能跑完 = 可完全简化 = 无死锁", { s: 14.5, c: SVGC.ok, stroke: SVGC.ok });
    markup += mark(320, 250, true, { r: 18 });
  }
  if (stage === 6) {
    markup += `${box(30, 72, 278, 240, { fill: "var(--card)", stroke: SVGC.ok, sw: 2.2, rx: 16 })}
      ${tcOr(160, 112, "可完全简化", SVGC.ok)}
      ${mark(160, 166, true, { r: 18 })}
      ${tlines(160, 218, ["所有进程都能跑完", "没有死锁"], { s: 13, c: SVGC.ink2, w: 600, lh: 23 })}
      ${box(332, 72, 278, 240, { fill: "var(--card)", stroke: SVGC.bad, sw: 2.2, rx: 16, dash: "7 6" })}
      ${tx(471, 112, "不可完全简化", { s: 18, c: SVGC.bad, w: 900 })}
      ${mark(471, 166, false, { r: 18 })}
      ${tlines(471, 218, ["总剩下边擦不掉", "存在死锁"], { s: 13, c: SVGC.ink2, w: 600, lh: 23 })}`;
  }
  return markup;
}
function tcOr(x, y, str, c) { return tx(x, y, str, { s: 18, c, w: 900 }); }

      content = `<rect x="${X}" y="${r.y}" width="${W}" height="${H}" rx="5" fill="${SVGC.proc}" class="grow"/>
        ${tx(X + W / 2, r.y + H / 2, "反复查询设备状态 · 全程忙等", { s: 11.5, c: "#fff", w: 800 })}`;
    } else if (i === 1) {

          content += `<rect x="${X + b * 114.5 + j * 27}" y="${r.y}" width="8" height="${H}" rx="2" fill="${SVGC.proc}" class="grow"/>`;

      content += `<rect x="${X}" y="${r.y}" width="${W}" height="${H}" rx="5" fill="none" stroke="${SVGC.line2}" stroke-width="1"/>`;
    } else if (i === 2) {

        content += `<rect x="${bx + 102}" y="${r.y}" width="11" height="${H}" rx="3" fill="${SVGC.proc}" class="grow"/>`;
      }
      content += `<rect x="${X}" y="${r.y}" width="${W}" height="${H}" rx="5" fill="none" stroke="${SVGC.line2}" stroke-width="1"/>`;
    } else {
      content = `<rect x="${X}" y="${r.y}" width="16" height="${H}" rx="3" fill="${SVGC.proc}" class="grow"/>

function polar(cx, cy, r, deg) {

/* ---------------- 4.5 缺页中断 ---------------- */
function pageFaultDiagram(step) {
  const rowY = [126, 158, 190, 222];
  const highlightRow = step === 2 || step === 5;
  const pageRows = [
    ["页 0", "在内存"], ["页 1", "在内存"], ["页 2", "在内存"], ["页 3", step >= 5 ? "已调入" : "不在内存"]
  ];
  let mem = "";
  for (let i = 0; i < 4; i++) {
    const x = 346 + (i % 2) * 106;
    const y = 94 + Math.floor(i / 2) * 98;
    const victim = i === 2 && step === 4;
    const target = i === 3 && step >= 5;
    const c = target ? SVGC.ok : victim ? SVGC.bad : SVGC.mem;
    mem += `<rect x="${x}" y="${y}" width="84" height="74" rx="6" fill="${c}" opacity="${target ? .18 : victim ? .16 : .07}" stroke="${c}" stroke-width="${target || victim ? 2.8 : 1.5}"/>
      ${tx(x + 42, y + 20, `块 ${i}`, { s: 10.5, c: SVGC.ink2, w: 600 })}
      ${tx(x + 42, y + 46, i === 2 ? "脏页" : i === 3 && step >= 5 ? "页 3" : "页 " + i, { s: 11, c: target ? SVGC.ok : victim ? SVGC.bad : SVGC.mem, w: 700 })}`;
  }
  return `
    ${tag(320, 32, `缺页中断 · 第 ${step} / 6 步`, { s: 13, c: SVGC.warn, stroke: SVGC.warn })}
    ${box(24, 148, 86, 66, { fill: SVGC.cpu, stroke: SVGC.cpu, sw: 2.2, rx: 10, op: step === 1 || step === 6 ? .2 : .1 })}
    ${tx(67, 181, "CPU", { s: 15, c: SVGC.cpu, w: 900 })}
    ${box(138, 64, 164, 168, { fill: "var(--card)", stroke: SVGC.mem, sw: 2, rx: 10 })}
    ${tx(220, 86, "页表（在内存）", { s: 12, c: SVGC.mem, w: 800 })}
    ${ln(150, 100, 290, 100, { c: SVGC.line2, sw: 1 })}
    ${pageRows.map((r, i) => `
      ${highlightRow && i === 3 ? `<rect x="146" y="${rowY[i] - 13}" width="148" height="26" rx="5" fill="${step >= 5 ? SVGC.ok : SVGC.bad}" opacity=".14"/>` : ""}
      ${tx(170, rowY[i], r[0], { s: 11, c: SVGC.ink2, w: 600 })}
      ${tx(278, rowY[i], r[1], { s: 11, c: i === 3 ? (step >= 5 ? SVGC.ok : SVGC.bad) : SVGC.ink2, w: 700 })}
    `).join("")}
    ${box(330, 64, 222, 218, { stroke: SVGC.mem, sw: 1.4, rx: 10, dash: "4 5", op: .6 })}
    ${tx(441, 53, "内存", { s: 12, c: SVGC.mem, w: 800 })}
    ${mem}
    ${box(288, 300, 82, 46, { fill: SVGC.warn, stroke: SVGC.warn, sw: 2.2, rx: 10, op: step === 3 ? .22 : .08 })}
    ${tx(329, 317, "OS", { s: 13, c: SVGC.warn, w: 900 })}
    ${tx(329, 334, "缺页处理", { s: 9, c: SVGC.ink2, w: 600 })}
    ${box(500, 300, 116, 52, { fill: SVGC.disk, stroke: SVGC.disk, sw: 2.2, rx: 10, op: step === 4 || step === 5 ? .18 : .08 })}
    ${tx(558, 319, "磁盘", { s: 12.5, c: SVGC.disk, w: 900 })}
    ${tx(558, 337, "有页 3", { s: 9.5, c: SVGC.ink2, w: 600 })}
    ${arrow(110, 181, 134, 154, { c: SVGC.proc, key: "darkblue", sw: 2.4 })}
    ${step === 3 ? arrow(302, 226, 320, 296, { c: SVGC.bad, key: "red", sw: 2.8 }) : ""}
    ${step === 4 ? arrow(370, 322, 496, 322, { c: SVGC.disk, key: "amber", sw: 2.6 }) : ""}
    ${step === 4 ? parrow("M410,268 C470,280 500,292 520,298", { c: SVGC.bad, key: "red", sw: 2, dash: "5 4" }) : ""}
    ${step === 5 ? arrow(540, 298, 540, 270, { c: SVGC.ok, key: "green", sw: 2.6 }) : ""}
    ${step === 5 ? arrow(330, 240, 304, 224, { c: SVGC.ok, key: "green", sw: 2, dash: "4 4" }) : ""}
    ${step === 6 ? parrow("M112,174 C190,132 260,136 300,168", { c: SVGC.ok, key: "green", sw: 2.6 }) : ""}
    ${step === 6 ? mark(67, 240, true, { r: 14 }) : ""}
    ${step === 1 ? tag(200, 366, "① CPU 访问某页", { s: 13, c: SVGC.proc, stroke: SVGC.proc }) : ""}
    ${step === 2 ? tag(200, 366, "② 查页表：这一页不在内存", { s: 13, c: SVGC.bad, stroke: SVGC.bad }) : ""}
    ${step === 3 ? tag(320, 366, "③ 产生缺页中断，转入 OS", { s: 13, c: SVGC.bad, stroke: SVGC.bad }) : ""}
    ${step === 4 ? tag(320, 372, "④ 从磁盘找页；没空闲块就换出，修改位=1 才写回", { s: 11.5, c: SVGC.warn, stroke: SVGC.warn }) : ""}
    ${step === 5 ? tag(320, 366, "⑤ 调入所需页，并更新页表", { s: 13, c: SVGC.ok, stroke: SVGC.ok }) : ""}
    ${step === 6 ? tag(320, 366, "⑥ 重新执行被中断的那条指令", { s: 13.5, c: SVGC.ok, stroke: SVGC.ok }) : ""}`;
}

/* ---------------- 4.6 抖动 ---------------- */
function thrashDiagram(stage) {
  if (stage === 1 || stage === 2) {
    const n = stage === 1 ? 4 : 6;
    const frames = stage === 1 ? 3 : 2;
    const colors = Array(6).fill(SVGC.proc);
    let zones = "";
    for (let i = 0; i < n; i++) {
      const x = 34 + (i % 3) * 194;
      const y = 96 + Math.floor(i / 3) * 122;
      zones += `<g class="pop" style="animation-delay:${i * .05}s">
        ${box(x, y, 180, 104, { fill: "var(--card)", stroke: colors[i], sw: 1.8, rx: 10 })}
        ${tx(x + 12, y + 18, `P${i + 1}`, { s: 12, a: "start", c: colors[i], w: 800 })}
        ${Array.from({ length: frames }).map((_, j) => `<rect x="${x + 12 + j * 50}" y="${y + 38}" width="42" height="30" rx="4" fill="${colors[i]}" opacity=".14" stroke="${colors[i]}" stroke-width="1.3"/>`).join("")}
        ${tx(x + 90, y + 88, `${frames} 个物理块`, { s: 10.5, c: SVGC.ink2, w: 600 })}
      </g>`;
    }
    return `
      ${tx(320, 48, stage === 1 ? "4 个进程，每个分到 3 个物理块" : "进程变多，每个进程只能分到 2 个物理块", { s: 17, w: 900 })}
      ${zones}
      ${stage === 2 ? tag(320, 368, "块太少 → 刚用到的页又被换出 → 缺页中断频繁", { s: 13, c: SVGC.bad, stroke: SVGC.bad }) : tag(320, 354, "分给每个进程的物理块越少，越容易缺页", { s: 13, c: SVGC.ink2 })}`;
  }
  if (stage === 3) {
    const bars = [28, 42, 58, 76, 92];
    return `
      ${tx(320, 46, "缺页率随进程数上升（全局置换）", { s: 17, w: 900 })}
      ${box(90, 90, 460, 220, { fill: "var(--card)", stroke: SVGC.line2, sw: 1.6, rx: 6 })}
      ${[0, 1, 2, 3, 4].map(i => `${ln(120, 122 + i * 38, 530, 122 + i * 38, { c: SVGC.line2, sw: 1, op: .35, dash: "3 4" })}${tx(104, 122 + i * 38, `${(5 - i) * 20}%`, { s: 9.5, a: "end", c: SVGC.muted, w: 600 })}`).join("")}
      ${bars.map((h, i) => `<rect x="${150 + i * 72}" y="${290 - h * 2}" width="38" height="${h * 2}" rx="4" fill="${SVGC.bad}" opacity="${.35 + i * .13}" class="grow"/>${tx(169 + i * 72, 300, `${i + 2}`, { s: 11, c: SVGC.ink2, w: 700 })}`).join("")}
      ${tx(320, 330, "进程数 →", { s: 12, c: SVGC.ink2, w: 700 })}
      ${tag(320, 368, "缺页中断频繁，系统大部分时间花在换页上 = 抖动", { s: 13.5, c: SVGC.bad, stroke: SVGC.bad })}`;
  }
  return `
    ${tx(320, 52, "抖动（Thrashing）", { s: 20, w: 900 })}
    ${[
      { t: "原因一", d: "进程数太多", c: SVGC.bad },
      { t: "原因二", d: "分给每个进程的物理块太少", c: SVGC.warn },
      { t: "结果", d: "缺页中断频繁，大部分时间在换页", c: SVGC.res },
      { t: "全局置换", d: "进程数增加，每个进程缺页率上升", c: SVGC.proc }
    ].map((it, i) => {
      const x = i % 2 === 0 ? 22 : 328, y = i < 2 ? 96 : 218;
      return `<g class="pop" style="animation-delay:${i * .07}s">
        ${box(x, y, 290, 104, { fill: "var(--card)", stroke: it.c, sw: 2.2, rx: 14 })}
        ${tx(x + 20, y + 30, it.t, { s: 14, a: "start", c: it.c, w: 900 })}
        ${tx(x + 20, y + 68, it.d, { s: 12.5, a: "start", c: SVGC.ink2, w: 600 })}
      </g>`;
    }).join("")}
    ${tag(320, 362, "口诀：分页管内存，分段管逻辑；缺页要重做，修改才写回", { s: 13, c: SVGC.warn, stroke: SVGC.warn })}`;
}

function sharingDiagram(stage) {
  const cx = 320, cy = 190;
  if (stage === 4) {
    return `
      ${tx(320, 52, "共享文件的互斥规则", { s: 19, w: 900 })}
      ${box(70, 100, 500, 70, { fill: "var(--card)", stroke: SVGC.ok, sw: 2.2, rx: 12 })}
      ${mark(102, 135, true, { r: 12 })}
      ${tx(124, 135, "多个读者可以同时读", { s: 14, a: "start", c: SVGC.ok, w: 700 })}
      ${box(70, 190, 500, 70, { fill: "var(--card)", stroke: SVGC.bad, sw: 2.2, rx: 12, dash: "6 4" })}
      ${mark(102, 225, false, { r: 12 })}
      ${tx(124, 225, "读者和写者不能同时", { s: 14, a: "start", c: SVGC.bad, w: 700 })}
      ${box(70, 280, 500, 70, { fill: "var(--card)", stroke: SVGC.bad, sw: 2.2, rx: 12, dash: "6 4" })}
      ${mark(102, 315, false, { r: 12 })}
      ${tx(124, 315, "多个写者也不能同时", { s: 14, a: "start", c: SVGC.bad, w: 700 })}
      ${tag(320, 380, "读写冲突要用互斥保证", { s: 14, c: SVGC.warn, stroke: SVGC.warn })}`;
  }
  const file = (x, y, label) => `
    <g class="pop">
      <path d="M${x - 42},${y - 38} H${x + 20} L${x + 42},${y - 16} V${y + 38} H${x - 42} Z" fill="var(--card)" stroke="${SVGC.file}" stroke-width="2.4"/>
      <path d="M${x + 20},${y - 38} V${y - 16} H${x + 42}" fill="none" stroke="${SVGC.file}" stroke-width="2"/>
      ${tx(x, y + 12, label, { s: 11, c: SVGC.file, w: 800 })}
    </g>`;
  const pos = [
    { x: 130, y: 120 }, { x: 130, y: 280 }, { x: 510, y: 120 }, { x: 510, y: 280 }
  ];
  let users;
  if (stage === 1) {
    users = pos.map((p, i) => ({ ...p, label: `读者 ${i + 1}`, c: SVGC.proc, kind: "read" }));
  } else if (stage === 2) {
    users = [
      { ...pos[0], label: "读者 1", c: SVGC.proc, kind: "read" },
      { ...pos[1], label: "读者 2", c: SVGC.proc, kind: "read" },
      { ...pos[2], label: "读者 3", c: SVGC.proc, kind: "read" },
      { ...pos[3], label: "写者", c: SVGC.bad, kind: "write" }
    ];
  } else {
    users = [
      { ...pos[0], label: "写者 1", c: SVGC.bad, kind: "write" },
      { ...pos[1], label: "写者 2", c: SVGC.bad, kind: "write" },
      { ...pos[2], label: "写者 3", c: SVGC.bad, kind: "write" }
    ];
  }
  return `
    ${tx(320, 48, stage === 1 ? "共享文件：多个读者同时读" : stage === 2 ? "读者 + 写者：不能同时" : "多个写者：也不能同时", { s: 18, c: stage === 1 ? SVGC.ok : SVGC.bad, w: 900 })}
    ${file(cx, cy, "共享文件")}
    ${users.map(u => {
      const left = u.x < cx;
      const startX = u.x + (left ? 58 : -58);
      const endX = cx + (left ? -50 : 50);
      const endY = cy + (u.y < cy ? -22 : 22);
      const bad = u.kind === "write";
      return `<g>
        ${pillNode(u.x - 58, u.y - 22, 116, 44, u.label, u.c, { fs: 11.5 })}
        ${arrow(startX, u.y, endX, endY, { c: bad ? SVGC.bad : SVGC.ok, key: bad ? "red" : "green", sw: 2.2, dash: "5 3" })}
      </g>`;
    }).join("")}
    ${stage === 1 ? mark(320, 320, true, { r: 16 }) : ""}
    ${stage === 1 ? tag(320, 360, "允许多个用户同时读", { s: 14, c: SVGC.ok, stroke: SVGC.ok }) : ""}
    ${stage === 2 ? `
      ${mark(320, 318, false, { r: 16 })}
      ${tag(320, 360, "读者和写者不能同时使用", { s: 14, c: SVGC.bad, stroke: SVGC.bad })}
    ` : ""}
    ${stage === 3 ? `
      ${mark(320, 318, false, { r: 16 })}
      ${tag(320, 360, "多个写者也不能同时使用", { s: 14, c: SVGC.bad, stroke: SVGC.bad })}
    ` : ""}`;
}

const QMAP = Object.fromEntries(ALLQ.concat(CARD6Q).map(q => [q.id, q]));
const CARDS = [CARD1, CARD2, CARD3, CARD4, CARD5, CARD6];

/* ============================================================
   交互引擎：页签、动画播放器、小测、综合自测、主题

(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const LETTERS = "ABCD";
  const players = new Map();

  let toastTimer = null;

  /* ---------------- 主题 ---------------- */
  const themeBtn = $("#themeBtn");
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const dark = theme === "dark";
    themeBtn.innerHTML = dark
      ? '<span class="theme-ico" aria-hidden="true">☀</span><span class="theme-txt">浅色</span>'
      : '<span class="theme-ico" aria-hidden="true">☾</span><span class="theme-txt">深色</span>';
    themeBtn.setAttribute("aria-label", dark ? "切换浅色模式" : "切换深色模式");
    try { localStorage.setItem("os-theme", theme); } catch (e) {}
  }
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("os-theme"); } catch (e) {}
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  /* ---------------- 工具 ---------------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function correctText(q) {
    if (q.parts) return q.parts.map((p, i) => `${["①", "②", "③"][i]} ${p.opts[p.a]}`).join("；");
    return q.opts[q.a];
  }
  function chosenText(q, choice) {
    if (q.parts) {
      if (!choice) return "未作答";
      return q.parts.map((p, i) => `${["①", "②", "③"][i]} ${p.opts[choice[i]]}`).join("；");
    }
    return q.opts[choice];
  }

  /* ---------------- 页签 ---------------- */
  const tabsEl = $("#tabs");
  const mainEl = $("#main");

  function buildTabs() {
    const nav = CARDS.concat([{ id: "p7", num: "⑦", short: "综合自测" }]);
    tabsEl.innerHTML = nav.map(card => `
      <button class="tab" role="tab" id="tab-${card.id}" aria-controls="panel-${card.id}"
              aria-selected="false" data-tab="${card.id}" type="button">
        <span class="tab-n" aria-hidden="true">${card.num}</span>${card.short}
      </button>`).join("");
    tabsEl.addEventListener("click", e => {
      const b = e.target.closest("[data-tab]");
      if (b) showTab(b.dataset.tab);
    });
  }

  function showTab(id, opts = {}) {
    if (id !== "p7" && !CARDS.some(c => c.id === id)) id = "p1";
    activeTab = id;
    $$(".tab", tabsEl).forEach(b => {
      const on = b.dataset.tab === id;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    $$(".card-panel", mainEl).forEach(p => p.classList.toggle("active", p.dataset.panel === id));
    $$(".anim", mainEl).forEach(a => { if (a.dataset.playing === "1") a.dataset.playing = "0"; });
    players.forEach(p => p.pause());
    $("#toast").hidden = true;
    if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: "auto" });
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  /* ---------------- 对比图 ---------------- */
  function shapeIcon(shape, color) {
    const common = `fill="none" stroke="${color}" stroke-width="3.2" stroke-linejoin="round"`;
    const shapes = {
      circle: `<circle cx="28" cy="28" r="17" ${common}/><circle cx="28" cy="28" r="4.5" fill="${color}"/>`,
      rect: `<rect x="7" y="13" width="42" height="30" rx="9" ${common}/><path d="M16 28h24" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity=".45"/>`,
      pill: `<rect x="5" y="19" width="46" height="18" rx="9" ${common}/><circle cx="17" cy="28" r="2.6" fill="${color}"/><path d="M24 28h17" stroke="${color}" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>`,
      square: `<rect x="12" y="12" width="32" height="32" rx="4" ${common}/><circle cx="22" cy="22" r="3" fill="${color}"/><circle cx="34" cy="34" r="3" fill="${color}"/>`,
      page: `<rect x="10" y="9" width="36" height="38" rx="5" ${common}/><path d="M18 20h20M18 28h20M18 36h12" stroke="${color}" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>`,
      doc: `<path d="M14 7h20l9 9v33H14z" ${common}/><path d="M34 7v10h9" ${common}/><path d="M20 26h17M20 33h17M20 40h11" stroke="${color}" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>`,
      disk: `<ellipse cx="28" cy="15" rx="16" ry="6" ${common}/><path d="M12 15v26c0 3.3 7.2 6 16 6s16-2.7 16-6V15" ${common}/><path d="M12 28c0 3.3 7.2 6 16 6s16-2.7 16-6" stroke="${color}" stroke-width="2.4" opacity=".55"/>`,
      cpu: `<rect x="10" y="10" width="36" height="36" rx="6" ${common}/><rect x="20" y="20" width="16" height="16" rx="2" fill="${color}" opacity=".25"/><path d="M18 5v5M28 5v5M38 5v5M18 46v5M28 46v5M38 46v5M5 18h5M5 28h5M5 38h5M46 18h5M46 28h5M46 38h5" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`,
      shield: `<path d="M28 6l18 7v13c0 12-8 20-18 24-10-4-18-12-18-24V13z" ${common}/><path d="M20 28l6 6 11-12" ${common}/>`
    };
    return `<svg viewBox="0 0 56 56" aria-hidden="true">${shapes[shape] || shapes.circle}</svg>`;
  }

  function compareHTML(cmp) {
    return `
      <div class="compare">
        ${cmp.cols.map(col => `
          <div class="cmp-col" style="--cc:${col.color}">
            <div class="cmp-top">
              <div class="cmp-icon">${shapeIcon(col.shape, col.color)}</div>
              <div><h4>${col.name}</h4><span>${col.tag || ""}</span></div>
            </div>
            <ul>${col.points.map(p => `<li>${p}</li>`).join("")}</ul>
          </div>`).join("")}
      </div>
      ${cmp.facts && cmp.facts.length ? `<div class="facts">${cmp.facts.map(f => `
        <div class="fact ${f.ok ? "ok" : "bad"}">
          <span class="fact-ico" aria-hidden="true">${f.ok ? "✓" : "✗"}</span>
          <span class="fact-text">${f.text}</span>
          <span class="fact-tag">${f.ok ? "对" : "错"}</span>
        </div>`).join("")}</div>` : ""}`;
  }

  /* ---------------- 动画播放器 ---------------- */
  class Player {
    constructor(anim, root) {
      this.anim = anim;
      this.root = root;
      this.i = 0;
      this.playing = false;
      this.speed = 1;
      this.timer = null;
      this.stage = $(".stage", root);
      this.sub = $(".subtitle", root);
      this.playBtn = $('[data-act="play"]', root);
      this.stepEl = $(".step-count", root);
      this.dotsEl = $(".dots", root);

      root.addEventListener("click", e => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const act = b.dataset.act;
        if (act === "prev") this.prev();
        if (act === "next") this.next();
        if (act === "play") this.toggle();
        if (act === "dot") { this.seek(Number(b.dataset.i)); this.root.dataset.playing = "0"; }
      });
      const speed = $('[data-act="speed"]', root);
      if (speed) speed.addEventListener("change", () => this.setSpeed(Number(speed.value)));

      this.renderDots();
      this.render();
    }
    get last() { return this.anim.frames.length - 1; }
    renderDots() {
      this.dotsEl.innerHTML = this.anim.frames.map((_, i) =>
        `<button class="dot" type="button" data-act="dot" data-i="${i}" aria-label="第 ${i + 1} 步"></button>`).join("");
    }
    render() {
      const f = this.anim.frames[this.i];
      this.stage.innerHTML = `<svg viewBox="0 0 640 400" role="img" aria-label="${escapeHTML(this.anim.title)} 第 ${this.i + 1} 步">${f.svg}</svg>`;
      this.sub.textContent = f.t;
      this.stepEl.textContent = `${this.i + 1} / ${this.anim.frames.length}`;
      $$(".dot", this.dotsEl).forEach((d, i) => d.classList.toggle("on", i === this.i));
      $('[data-act="prev"]', this.root).disabled = this.i === 0;
      $('[data-act="next"]', this.root).disabled = this.i === this.last;
      this.playBtn.innerHTML = this.playing
        ? "⏸ 暂停"
        : (this.i === this.last ? "↻ 重播" : "▶ 播放");
      this.playBtn.setAttribute("aria-label", this.playing ? "暂停动画" : "播放动画");
    }
    updatePlayUI() {
      this.playBtn.innerHTML = this.playing ? "⏸ 暂停" : (this.i === this.last ? "↻ 重播" : "▶ 播放");
      this.playBtn.setAttribute("aria-label", this.playing ? "暂停动画" : "播放动画");
    }
    schedule() {
      clearTimeout(this.timer);
      if (!this.playing) return;
      const f = this.anim.frames[this.i];
      const dur = (f.d || 3400) / this.speed;
      this.timer = setTimeout(() => {
        if (!this.playing) return;
        if (this.i < this.last) {
          this.i++;
          this.render();
          this.schedule();
        } else {
          this.playing = false;
          this.root.dataset.playing = "0";
          this.updatePlayUI();
        }
      }, dur);
    }
    play() {
      if (this.i >= this.last) { this.i = 0; this.render(); }
      this.playing = true;
      this.root.dataset.playing = "1";
      this.updatePlayUI();
      this.schedule();
    }
    pause() {
      this.playing = false;
      clearTimeout(this.timer);
      this.root.dataset.playing = "0";
      this.updatePlayUI();
    }
    toggle() { this.playing ? this.pause() : this.play(); }
    seek(i, keepPaused = true) {
      clearTimeout(this.timer);
      this.i = Math.max(0, Math.min(this.last, i));
      if (keepPaused) this.playing = false;
      this.render();
      if (this.playing) this.schedule();
    }
    next() {
      clearTimeout(this.timer);
      this.playing = false;
      if (this.i < this.last) this.i++;
      this.render();
    }
    prev() {
      clearTimeout(this.timer);
      this.playing = false;
      if (this.i > 0) this.i--;
      this.render();
    }
    setSpeed(v) {
      this.speed = v || 1;
      if (this.playing) this.schedule();
    }
  }

  /* ---------------- 渲染卡片 ---------------- */
  function animHTML(a) {
    return `
      <article class="anim" id="anim-${a.id}" data-anim="${a.id}">
        <div class="anim-head">
          <span class="anim-no">动画 ${a.no}</span>
          <h4>${a.title}</h4>
          <span class="anim-len">${a.frames.length} 步 · ${Math.round(a.frames.reduce((s, f) => s + (f.d || 3400), 0) / 1000)} 秒</span>
        </div>
        <div class="stage"></div>
        <div class="subtitle"></div>
        <div class="controls">
          <button class="btn" type="button" data-act="prev">◀ 上一步</button>
          <button class="btn primary" type="button" data-act="play">▶ 播放</button>
          <button class="btn" type="button" data-act="next">下一步 ▶</button>
          <span class="step-count">1 / 1</span>
          <div class="dots"></div>
          <label class="speed">速度
            <select data-act="speed" aria-label="播放速度">
              <option value="0.75">0.75×</option>

              <option value="1.5">1.5×</option>

  }

  function renderCard(card) {
    const panel = document.createElement("section");
    panel.className = "card-panel";
    panel.id = `panel-${card.id}`;
    panel.dataset.panel = card.id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", `tab-${card.id}`);
    panel.innerHTML = `
      <div class="card-hero" style="--accent-card:${card.color}">

        <h2>${card.title}</h2>
        <p>${card.intro}</p>
        <div class="chips">${card.chips.map((c, i) => `<span class="chip${i === 0 ? " key" : ""}">${c}</span>`).join("")}</div>
      </div>

      <section class="sec">
        <div class="sec-head"><span class="sec-num">A</span><h3>看动画，记画面</h3></div>
        <p class="sec-desc">每段不超过 1 分钟。可以暂停、上一步、下一步；底部大字幕就是这一帧要记的话。</p>
        <div class="anim-list">${card.anims.map(animHTML).join("")}</div>
      </section>

      <section class="sec">
        <div class="sec-head"><span class="sec-num">B</span><h3>容易混淆的点</h3></div>
        <p class="sec-desc">先看两边的概念，再看下面的对错句。✓ / ✗ 图标和边框样式同时区分，不只靠颜色。</p>
        ${compareHTML(card.compare)}
      </section>

      <section class="sec">
        <div class="sec-head"><span class="sec-num">C</span><h3>一句口诀</h3></div>
        <div class="mnemonic">
          <span class="mn-label">考前默念</span>

      <section class="sec">

        <p class="sec-desc">选完立刻判对错。答错会自动滚到对应动画并回放，底部提示条保留理由和“回到小测”。</p>
        <div class="quiz-host"></div>
      </section>`;
    mainEl.appendChild(panel);

    card.anims.forEach(a => {
      const root = panel.querySelector(`#anim-${a.id}`);
      players.set(a.id, new Player(a, root));

    const qHost = panel.querySelector(".quiz-host");
    const cardQuestions = card.quiz.map(id => QMAP[id]).filter(Boolean);
    mountQuiz(qHost, cardQuestions, {
