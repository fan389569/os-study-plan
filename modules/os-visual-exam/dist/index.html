}

}

.legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; font-size: 10px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 4px; }

.sw.page { background: var(--index); }
.sw.mem { background: var(--data); }

.sw.free { background: var(--free); }

.tbl {

}

  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 9px 10px;

}
.res span { display: block; font-size: 10px; color: var(--muted); }

  border: 1px solid var(--line);

}
.big-result span { font-size: 12px; color: var(--muted); }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: center; }

/* ===== 位串 ===== */
.bitbar { display: flex; gap: 6px; margin: 14px 0 5px; }

.mem-cap { font-size: 12px; font-weight: 800; color: var(--text); }
.mem-bar {
  position: relative;
  height: 58px;
  background: var(--panel2);
  border: 1.5px solid var(--line);
  border-radius: 11px;
  overflow: hidden;
}
.seg {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-left: 2px solid var(--panel);
  transition: left 0.35s ease, width 0.35s ease, background 0.25s;
}
.seg:nth-child(1) { border-left: 0; }

@keyframes segFlash {
  0% { box-shadow: inset 0 0 0 0 var(--hi); }
  35% { box-shadow: inset 0 0 0 4px var(--hi); }

}

  40% { box-shadow: inset 0 0 0 5px var(--free); }
  100% { box-shadow: inset 0 0 0 0 transparent; }
}
.mem-ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); padding: 4px 2px 0; }

.chain-wrap { margin: 10px 0 8px; }
.chain-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.chain-cap span { font-weight: 400; letter-spacing: 0; }
.chain { display: flex; align-items: stretch; overflow-x: auto; padding: 2px 1px 7px; }
.fc-node {
  flex: 0 0 auto;
  min-width: 92px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 6px 9px;
  text-align: center;

/* ===== 模块① ===== */

.chain-scroll { overflow-x: auto; padding: 4px 1px 8px; }
.link-chain { display: flex; align-items: stretch; min-width: max-content; }
.lc { min-width: 76px; border: 1.5px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 5px; text-align: center; }

.lc-ar { align-self: center; padding: 0 4px; color: var(--muted); font-size: 11px; }

.inode-box { border: 1.5px solid var(--page); background: var(--panel); border-radius: 14px; padding: 12px 14px; margin: 10px 0 12px; }
.inode-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }

.ptr-lab { font-size: 9px; letter-spacing: 0.05em; color: var(--muted); margin: 4px 0 4px; }
.ptr-row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }

.ptr { border: 1px solid var(--line); background: var(--panel2); border-radius: 5px; padding: 5px 0; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }

.levels { display: flex; flex-direction: column; gap: 7px; }

.c4 { aspect-ratio: 1; border-radius: 2px; background: var(--panel); border: 1px solid var(--line); animation: cellIn 0.35s ease-out both; animation-delay: calc(var(--i) * 2.5ms); }

.two-level { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.tl-box { border: 1.5px solid; border-radius: 11px; padding: 11px 13px; text-align: center; min-width: 110px; }

.axis-note { font-size: 9px; color: var(--muted); margin-top: 9px; }

.read-counter { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 8px 0; }

.region-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 10px 0; }

.cmp-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0; }
.cmp-card { border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px; text-align: center; opacity: 0.6; transition: 0.25s; }

.cmp-idx { font-size: 9px; color: var(--muted); }
.cmp-addr { font-size: 9px; color: var(--muted); }

.cmp-tag { min-height: 12px; font-size: 9px; font-weight: 800; color: var(--hi); }

/* ===== 模块④ ===== */
.arch { display: flex; flex-direction: column; align-items: center; margin: 14px auto; max-width: 460px; }
.arch-row { display: flex; align-items: center; justify-content: center; gap: 9px; flex-wrap: wrap; }
.arch-tie { color: var(--muted); font-size: 14px; }
.arch-box { width: 250px; border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 10px 15px; text-align: center; opacity: 0.68; transition: 0.25s; font-size: 12px; font-weight: 700; }
.arch-row .arch-box { width: 150px; padding: 9px 12px; }
.arch-row .arch-box.tlb { width: 170px; }
.arch-box.on { opacity: 1; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10); }
.arch-box.cpu { border-color: var(--accent); background: var(--accent-bg); opacity: 1; }
.arch-box.tlb { border-color: var(--tlb); background: var(--tlb-bg); color: var(--tlb); }
.arch-box.pt { border-color: var(--index); background: var(--index-bg); color: var(--index); }
.arch-box.data { border-color: var(--data); background: var(--data-bg); color: var(--data); }
.arch-box span { display: block; margin-top: 2px; font-size: 9px; font-weight: 400; color: var(--muted); }
.arch-arrow { font-size: 9px; color: var(--muted); padding: 5px 0; text-align: center; }
.arch-arrow.on { color: var(--hi); font-weight: 700; }
.tl-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 56px; align-items: center; gap: 9px; margin: 11px 0; }
.tl-name b { display: block; font-size: 11px; }
.tl-name span { font-size: 8px; color: var(--muted); }
.tl-track { background: var(--panel2); border-radius: 7px; padding: 2px; border: 1px solid var(--line); }
.tl-bar { display: flex; height: 32px; border-radius: 5px; overflow: hidden; }
.tl-seg { display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font-family: var(--mono); font-size: 9px; font-weight: 700; }
.tl-seg.tlb { background: var(--tlb-bg); color: var(--tlb); border-right: 2px solid var(--panel); }
.tl-seg.page { background: var(--index-bg); color: var(--index); border-right: 2px solid var(--panel); }
.tl-seg.mem { background: var(--data-bg); color: var(--data); }
.tl-seg.saved { background: transparent; border: 1.5px dashed var(--tlb); color: var(--tlb); }
.tl-total { font-family: var(--mono); font-size: 13px; font-weight: 800; text-align: right; }
.dot-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; max-width: 330px; margin: 13px auto; }
.dot { aspect-ratio: 1; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); }
.dot.hit { background: var(--tlb); border-color: var(--tlb); }
.dot.miss { background: var(--hi); border-color: var(--hi); }
.calc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 11px 0; }
.calc-col { border: 1.5px solid; border-radius: 11px; padding: 11px; text-align: center; }
.calc-col.hit { border-color: var(--tlb); background: var(--tlb-bg); color: var(--tlb); }
.calc-col.miss { border-color: var(--hi); background: var(--hi-bg); color: var(--hi); }
.calc-col b { display: block; font-size: 12px; }
.calc-col span { font-family: var(--mono); font-size: 11px; }
.var-table { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 9px 0; }
.var-table span { font-size: 11px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.slider-card { background: var(--panel); border: 1.5px solid var(--tlb); border-radius: 12px; padding: 11px 14px; margin: 11px 0; }
.slider-top { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; }
.slider-top b { font-family: var(--mono); font-size: 18px; color: var(--tlb); }
.h-slider { width: 100%; height: 26px; accent-color: var(--tlb); }
.slider-mid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px; font-size: 10px; color: var(--muted); }
.slider-mid b { font-family: var(--mono); color: var(--text); }
.slider-mid .eat-now b { color: var(--tlb); font-size: 14px; }
.slider-note { text-align: center; font-size: 10px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
.eat-chart { display: block; width: 100%; max-width: 680px; height: auto; margin: 8px auto 0; }
.chart-bg { fill: var(--panel2); }
.axis { stroke: var(--line2); stroke-width: 1.5; }
.no-tlb-line { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
.eat-line { fill: none; stroke: var(--tlb); stroke-width: 3; }
.be-dot { fill: var(--muted); }
.guide { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.6; }
.marker { fill: var(--hi); stroke: var(--panel); stroke-width: 2; }
.marker-lab { fill: var(--hi); font-family: var(--mono); font-size: 11px; font-weight: 800; }
.chart-lab { fill: var(--muted); font-size: 9px; }
.chart-lab.end { text-anchor: end; }
.chart-lab.mid { text-anchor: middle; }
.be-label { display: none; }
@media (max-width: 720px) {
  .chart-lab { font-size: 15px; }
  .marker-lab { font-size: 17px; }
}

/* ===== 模块⑤ ===== */
.review-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.review-head h2 { margin: 5px 0 3px; font-size: clamp(22px, 3vw, 32px); }
.review-head p { margin: 0; color: var(--muted); font-size: 13px; }

.fs-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid #111827; padding-bottom: 9px; margin-bottom: 12px; }

.fs-head p { margin: 2px 0 0; font-size: 11px; color: #4b5563; }
.fs-badge { font-size: 10px; border: 1px solid #9ca3af; border-radius: 999px; padding: 3px 8px; color: #374151; }
.fs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fs-block { border: 1px solid #d1d5db; border-top: 4px solid; border-radius: 11px; padding: 10px 12px; background: #fff; break-inside: avoid; }
.fs-m1 { border-top-color: #4338ca; }
.fs-m2 { border-top-color: #0f766e; }
.fs-m3 { border-top-color: #15803d; }
.fs-m4 { border-top-color: #c2410c; }
.fs-title { font-size: 14px; font-weight: 800; margin-bottom: 6px; color: #111827; }
.fs-title span { font-family: var(--mono); margin-right: 3px; }
.fs-line { position: relative; padding-left: 9px; font-size: 11.5px; line-height: 1.65; color: #111827; }
.fs-line::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 4px; height: 4px; border-radius: 50%; background: #9ca3af; }
.fs-line b { font-family: var(--mono); color: #4338ca; }
.fs-ex { margin-top: 6px; padding: 7px 9px; border-radius: 7px; background: #f3f4f6; font-size: 10.5px; line-height: 1.6; color: #374151; }
.fs-warn { margin-top: 5px; font-size: 10px; color: #be123c; }
.fs-foot { margin-top: 12px; text-align: center; font-size: 10px; color: #6b7280; }
.selftest { margin-top: 28px; }
.st-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.st-head h3 { margin: 0; font-size: 21px; }
.st-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.st-progress { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
.st-progress b { font-family: var(--mono); color: var(--accent); }
.st-progress.done { border-color: var(--free); color: var(--free); background: var(--free-bg); }
.q-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.q-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; }
.q-head { display: flex; align-items: center; gap: 6px; }
.q-tag { background: var(--accent); color: var(--on-color); border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 10px; font-weight: 800; }
.q-type { font-size: 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 6px; }
.q-title { margin: 8px 0 5px; font-size: 14px; }
.q-body { flex: 1; font-size: 12px; line-height: 1.65; color: var(--muted); }
.q-body p { margin: 0 0 3px; }
.reveal { align-self: flex-start; margin-top: 9px; border: 1.5px solid var(--accent); background: var(--accent-bg); color: var(--accent); border-radius: 8px; padding: 6px 11px; font-size: 11px; font-weight: 800; }
.reveal.open { background: var(--panel2); border-color: var(--line); color: var(--muted); }
.q-ans { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }
.sol-step { display: flex; gap: 7px; padding: 5px 0; opacity: 0; animation: solIn 0.35s ease-out forwards; }
.q-ans .sol-step:nth-child(1) { animation-delay: 0.04s; }
.q-ans .sol-step:nth-child(2) { animation-delay: 0.10s; }
.q-ans .sol-step:nth-child(3) { animation-delay: 0.16s; }
.q-ans .sol-step:nth-child(4) { animation-delay: 0.22s; }
.q-ans .sol-step:nth-child(5) { animation-delay: 0.28s; }
.q-ans .sol-step:nth-child(6) { animation-delay: 0.34s; }
@keyframes solIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ss-n { flex: 0 0 17px; height: 17px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; font-family: var(--mono); font-size: 9px; font-weight: 800; }
.ss-body { font-size: 11.5px; line-height: 1.6; }
.final-answer { margin-top: 7px; padding: 8px 11px; border: 1px solid var(--free); background: var(--free-bg); color: var(--free); border-radius: 8px; font-size: 11.5px; font-weight: 700; line-height: 1.6; }
.final-answer span { display: inline-block; font-size: 9px; border: 1px solid var(--free); border-radius: 4px; padding: 0 4px; margin-right: 5px; }
.mini-axis { position: relative; display: flex; height: 32px; margin: 15px 0 3px; }
.ma { display: flex; align-items: center; justify-content: center; border: 1px solid; font-family: var(--mono); font-size: 8px; }
.ma.direct { background: var(--data-bg); border-color: var(--data); color: var(--data); border-radius: 6px 0 0 6px; }
.ma.single { background: var(--index-bg); border-color: var(--index); color: var(--index); border-left: 0; }
.ma.double { background: var(--page-bg); border-color: var(--page); color: var(--page); border-left: 0; border-radius: 0 6px 6px 0; }
.ma-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--hi); }
.ma-mark span { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--hi); color: var(--on-color); font-family: var(--mono); font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px; }
.mini-axis-note { font-size: 9px; color: var(--muted); }
.hex-split { display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 9px 0; }
.hxs { font-family: var(--mono); font-size: 17px; font-weight: 800; padding: 4px 8px; border: 1.5px solid var(--page); background: var(--page-bg); color: var(--page); border-radius: 6px; }
.hxs.off { border-color: var(--line); background: var(--panel2); color: var(--muted); }
.hxs.frame { border-color: var(--frame); background: var(--frame-bg); color: var(--frame); }
.hxs-ar { color: var(--muted); font-size: 11px; }
.sol-table-wrap { overflow-x: auto; margin: 4px 0 8px; }
.tbl.compact th, .tbl.compact td { padding: 4px 6px; font-size: 10px; }
.mini-mem .mem-bar { height: 34px; }
.mini-mem .seg-name { font-size: 9px; }
.mini-mem .seg-kb { font-size: 8px; }
.mini-mem .mem-ticks { font-size: 8px; }

/* ===== 响应式 ===== */
@media (max-width: 900px) {
  .q-grid { grid-template-columns: 1fr; }

}

}
@media (max-width: 420px) {

@media (prefers-reduced-motion: reduce) {

/* ===== 打印：只保留公式卡 ===== */
@media print {
  @page { size: A4; margin: 10mm; }

<script>
/* ===== solver.js ===== */
/* 操作系统四个考点 · 统一计算源
 * 页面上所有题目数字都由这里计算，不在 HTML 里手写答案。
 * 浏览器中挂到 window.OS；Node 中挂到 globalThis.OS。

(function (global) {

    linked: {
      blockSize: 1024,
      blocks: [10, 61, 32, 75, 87, 98, 46, 37, 33, 11],

    },

      ptrSize: 4,

    },
    pagingA: {
      addrBits: 18,

    var start = 0;
    ['direct', 'single', 'double', 'triple'].forEach(function (key) {
      var count = counts[key];
      regions.push({
        key: key,
        label: REGION_LABEL[key],
        start: start,
        end: start + count, // 不含
        count: count,
        depth: depthOf[key],
        readCost: depthOf[key] + 1, // 数据块那一次也算
        ptrCount: {
          direct: cfg.nDirect,
          single: cfg.nSingle,
          double: cfg.nDouble,
          triple: cfg.nTriple

      cfg: clone(cfg),

    if (index < 0 || index >= L.totalBlocks) {

    var region = null;
    for (var i = 0; i < L.regions.length; i++) {
      var r = L.regions[i];
      if (r.count > 0 && index >= r.start && index < r.end) {
        region = r;
        break;

    }
    assert(region, '找不到块所在区域');
    var rel = index - region.start;
    var ptrIndex = 0;
    var entries = [];
    var p = L.p;
    if (region.depth === 0) {
      // 直接指针没有间接索引项
      entries = [];
    } else if (region.depth === 1) {
      ptrIndex = Math.floor(rel / p);
      entries = [rel % p];
    } else if (region.depth === 2) {
      ptrIndex = Math.floor(rel / (p * p));
      var rem2 = rel % (p * p);
      entries = [Math.floor(rem2 / p), rem2 % p];
    } else {
      ptrIndex = Math.floor(rel / (p * p * p));
      var rem3 = rel % (p * p * p);

        Math.floor(rem3 / (p * p)),
        Math.floor((rem3 % (p * p)) / p),
        rem3 % p

          html: function () {

          }
        }
      ]
    };
  }

  function pathDiagram(reads) {
    var nodes = [
      { key: 'inode', title: 'inode', sub: '已在内存 · 不读盘', badge: '0 次' },
      { key: 'l1', title: '一级索引块', sub: '二级间接的顶层', badge: '第 1 次读盘' },
      { key: 'l2', title: '二级索引块', sub: '顶层索引块的第 0 项', badge: '第 2 次读盘' },
      { key: 'data', title: '数据块 ' + I.blockIndex, sub: '第 18 项指向它', badge: '第 3 次读盘' }
    ];
    var order = ['inode', 'l1', 'l2', 'data'];
    var html = '<div class="path">';
    nodes.forEach(function (n) {
      var lit = n.key === 'inode' || order.indexOf(n.key) <= reads;
      html += '<div class="path-node ' + (lit ? 'lit' : '') + ' ' + n.key + '">' +
        '<div class="pn-main"><b>' + n.title + '</b><span>' + n.sub + '</span></div>' +
        '<div class="pn-badge">' + n.badge + '</div></div>';
      if (n.key !== 'data') {
        var lab = n.key === 'inode' ? '二级指针' : (n.key === 'l1' ? '第 ' + I.access.entries[0] + ' 项' : '第 ' + I.access.entries[1] + ' 项');
        html += '<div class="path-arrow"><span>' + lab + '</span>↓</div>';
      }
    });
    html += '</div>';
    return html + '<div class="read-counter"><span>读盘次数</span><b>' + reads + '</b><span>/ 3</span></div>';
  }

  function freeTxt(f) { return '[' + f.start + ',' + (f.start + f.size) + ') ' + f.size + 'KB'; }
  function allocTxt(a) { return '[' + a.start + ',' + (a.start + a.size) + ')'; }

  function opBanner(s) {
    if (s.op.type === 'init') return '<div class="op-banner init"><span class="op-tag">起点</span><b>初始状态</b></div>';
    if (s.op.type === 'alloc') {
      return '<div class="op-banner alloc"><span class="op-tag">申请</span><b>' + s.op.name + '</b><em>' + s.op.size + ' KB</em>' +
        '<span class="op-step">操作 ' + s.index + ' / ' + (S.length - 1) + '</span></div>';
    }
    return '<div class="op-banner free"><span class="op-tag">释放</span><b>' + s.op.name + '</b><em>' + s.released.size + ' KB</em>' +
      '<span class="op-step">操作 ' + s.index + ' / ' + (S.length - 1) + '</span></div>';
  }

  function scanLine(s) {
    if (!s.scan || !s.scan.length) return '';
    var items = s.scan.map(function (x) {
      return '<span class="sl-item ' + (x.ok ? 'ok' : 'no') + '">[' + x.start + ',' + (x.start + x.size) + ') ' +
        x.size + 'KB · ' + (x.ok ? '够，选中' : '不够，跳过') + '</span>';
    }).join('<span class="sl-ar">→</span>');
    return '<div class="scanline"><span class="sl-cap">扫描空闲链</span>' + items + '</div>';
  }

  function splitNote(s) {
    if (!s.split) return '';
    var sp = s.split;
    return '<div class="split-note"><b>切分：</b>从 [' + sp.original.start + ',' + (sp.original.start + sp.original.size) + ') ' +
      sp.original.size + 'KB 中，切出 [' + sp.allocated.start + ',' + (sp.allocated.start + sp.allocated.size) + ') ' +
      sp.allocated.size + 'KB；剩下 ' +
      (sp.remain ? '[' + sp.remain.start + ',' + (sp.remain.start + sp.remain.size) + ') ' + sp.remain.size + 'KB' : '0KB，节点删除') + '。</div>';
  }

  function mergeNote(s) {
    if (s.op.type !== 'free') return '';
    var txt = '释放 [' + s.released.start + ',' + (s.released.start + s.released.size) + ') ' + s.released.size + 'KB。';
    if (!s.merges || !s.merges.length) {
      return '<div class="merge-note no-merge"><b>' + txt + '</b>前后空闲块都不相邻 → <b>不合并</b>。</div>';
    }
    var parts = s.merges.map(function (m) {
      return '与' + (m.side === 'left' ? '左边' : '右边') + ' [' + m.other.start + ',' + (m.other.start + m.other.size) + ') ' + m.other.size + 'KB 相邻';
    }).join('；');
    return '<div class="merge-note has-merge"><b>' + txt + '</b>' + parts + ' → 合并成 [' +
      s.mergedBlock.start + ',' + (s.mergedBlock.start + s.mergedBlock.size) + ') <b>' + s.mergedBlock.size + 'KB</b>。</div>';
  }

  function fitView(s) {
    var marks = {};
    if (s.scan) {
      s.scan.forEach(function (x) { if (!x.ok) marks[x.start] = 'skip'; });
    }
    if (s.split && s.split.remain) marks[s.split.remain.start] = 'split';
    if (s.merges && s.merges.length && s.mergedBlock) marks[s.mergedBlock.start] = 'merge';

    var flashStart = null;
    if (s.op.type === 'alloc' && s.allocated) flashStart = s.allocated.start;
    if (s.op.type === 'free' && s.merges && s.merges.length) flashStart = s.mergedBlock.start;

    return U.memStrip(FIT.memKB, s.free, s.alloc, {
      flashStart: flashStart,
      mergeStart: s.merges && s.merges.length ? s.mergedBlock.start : null
    }) +
      U.freeChain(s.free, { marks: marks }) +
      U.allocLine(s.alloc) +
      scanLine(s) + splitNote(s) + mergeNote(s);
  }

  function sceneStrip() {
    return {
      id: '3.0',
      short: '内存条',
      title: '内存是一条长条',
      steps: [
        {
          caption: '把内存用户区想成一条 ' + FIT.memKB + 'KB 的长条，初始整条都是空闲的。',
          html: function () {
            return U.sceneHead('3.0 场景', '先画一条内存', '0 到 512KB，左闭右开') +
              U.memStrip(FIT.memKB, [{ start: 0, size: FIT.memKB }], []) +
              say('左闭右开 [0,512) 表示包含 0，不包含 512；每一段都这样写，终点不会重复算。');
          }
        },
        {
          caption: '空闲分区链按起始地址从小到大排队，每个节点只记两件事：起始地址、大小。',
          html: function () {
            return U.sceneHead('3.0 场景', '空闲分区链') +
              U.memStrip(FIT.memKB, [{ start: 0, size: FIT.memKB }], []) +
              U.freeChain([{ start: 0, size: FIT.memKB }]) +
              say('分配就是改这条链；释放就是往链里插节点。所有操作都围着这条链转。');
          }
        }
      ]
    };
  }

  /* ---------- 3.1 规则（示意链） ---------- */

  var DEMO = {
    free: [{ start: 0, size: 60 }, { start: 200, size: 120 }, { start: 400, size: 300 }],
    req: 130
  };
  var DEMO_CHOICE = DEMO.free.filter(function (f) { return f.size >= DEMO.req; })[0];
  var DEMO_REST = { start: DEMO_CHOICE.start + DEMO.req, size: DEMO_CHOICE.size - DEMO.req };

  function sceneRule() {
    return {
      id: '3.1',
      short: '规则',
      title: '首次适应的规则',
      steps: [
        {
          caption: '首次适应：从链首开始扫，遇到第一个装得下的空闲块就分配。',
          html: function () {
            return U.sceneHead('3.1 场景', '一句话规则', '示意链：只看规则，不画整条内存') +
              U.freeChain(DEMO.free) +
              '<div class="request-banner">收到申请：<b>' + DEMO.req + ' KB</b></div>' +
              say('从第一个节点开始看，够大就停，不往后比较谁更合适。');
          }
        },
        {
          caption: '第一个 ' + DEMO.free[0].size + 'KB 不够，跳过；第二个 ' + DEMO.free[1].size + 'KB 也不够，跳过；第三个 ' + DEMO.free[2].size + 'KB 够，停下。',
          dur: 6500,
          html: function () {
            var marks = {};
            marks[0] = 'skip'; marks[200] = 'skip'; marks[400] = 'chosen';
            return U.sceneHead('3.1 场景', '扫描指针从左往右') +
              U.freeChain(DEMO.free, { marks: marks }) +
              '<div class="scanline"><span class="sl-cap">扫描</span>' +
                '<span class="sl-item no">' + freeTxt(DEMO.free[0]) + ' · 不够，跳过</span><span class="sl-ar">→</span>' +
                '<span class="sl-item no">' + freeTxt(DEMO.free[1]) + ' · 不够，跳过</span><span class="sl-ar">→</span>' +
                '<span class="sl-item ok">' + freeTxt(DEMO.free[2]) + ' · 够，选中</span></div>' +
              say('扫描指针走到第一个够大的节点就停，这就是“首次适应”。');
          }
        },
        {
          caption: '切掉 ' + DEMO.req + 'KB，剩下的 ' + DEMO_REST.size + 'KB 留在原处，起始地址从 ' + DEMO_CHOICE.start + ' 挪到 ' + DEMO_REST.start + '。',
          dur: 6200,
          html: function () {
            var after = [
              { start: 0, size: 60 },
              { start: 200, size: 120 },
              { start: DEMO_REST.start, size: DEMO_REST.size }
            ];
            return U.sceneHead('3.1 场景', '切分与剩余') +
              '<div class="split-visual">' +
                '<div class="sv-orig"><b>[' + DEMO_CHOICE.start + ',' + (DEMO_CHOICE.start + DEMO_CHOICE.size) + ') ' + DEMO_CHOICE.size + 'KB</b><span>原空闲块</span></div>' +
                '<div class="sv-arrow">→</div>' +
                '<div class="sv-alloc"><b>[' + DEMO_CHOICE.start + ',' + (DEMO_CHOICE.start + DEMO.req) + ') ' + DEMO.req + 'KB</b><span>分配给作业</span></div>' +
                '<div class="sv-plus">+</div>' +
                '<div class="sv-rest"><b>[' + DEMO_REST.start + ',' + (DEMO_REST.start + DEMO_REST.size) + ') ' + DEMO_REST.size + 'KB</b><span>剩下的空闲</span></div>' +
              '</div>' +
              U.freeChain(after, { marks: (function () { var m = {}; m[DEMO_REST.start] = 'split'; return m; })() }) +
              say('只改节点里的“起始地址”和“大小”，节点位置不动。');
          }
        }
      ]
    };
  }

  /* ---------- 3.2 主线题 7 步 ---------- */

  function sceneMain() {
    var caps = [
      '初始：整条 ' + FIT.memKB + 'KB 空闲，空闲链只有一个节点 [0,' + FIT.memKB + ')。',
      S[1].op.name + ' 申请 ' + S[1].op.size + 'KB：链首 [0,' + FIT.memKB + ') 够大，分配 ' + allocTxt(S[1].allocated) + '，剩下 ' + freeTxt(S[1].split.remain) + '。',
      S[2].op.name + ' 申请 ' + S[2].op.size + 'KB：链首 ' + freeTxt(S[1].free[0]) + ' 够大，分配 ' + allocTxt(S[2].allocated) + '，剩下 ' + freeTxt(S[2].split.remain) + '。',
      S[3].op.name + ' 申请 ' + S[3].op.size + 'KB：链首 ' + freeTxt(S[2].free[0]) + ' 够，分配 ' + allocTxt(S[3].allocated) + '，剩下 ' + freeTxt(S[3].split.remain) + '。',
      S[4].op.name + ' 释放 ' + freeTxt(S[4].released) + '。它和 ' + freeTxt(S[3].free[0]) + ' 不相邻，不合并，空闲链变成两块。',
      S[5].op.name + ' 申请 ' + S[5].op.size + 'KB：先看 ' + freeTxt(S[5].scan[0]) + ' 不够，跳过；再看 ' + freeTxt(S[5].scan[1]) + ' 够，分配 ' + allocTxt(S[5].allocated) + '。',
      S[6].op.name + ' 释放 ' + freeTxt(S[6].released) + '。它和右边的 ' + freeTxt(S[6].merges[0].other) + ' 紧挨着，合并成 ' + freeTxt(S[6].mergedBlock) + '。',
      S[7].op.name + ' 申请 ' + S[7].op.size + 'KB：链首 ' + freeTxt(S[6].free[0]) + ' 够，分配 ' + allocTxt(S[7].allocated) + '，剩下 ' + freeTxt(S[7].split.remain) + '。'
    ];
    var steps = [];
    for (var i = 0; i <= 7; i++) {
      (function (idx) {
        steps.push({
          caption: caps[idx],
          dur: idx === 0 || idx === 5 || idx === 6 ? 6500 : 5600,
          html: function () {
            return U.sceneHead('3.2 · 主线题', '7 步操作 · 第 ' + idx + ' 步', '首次适应：每步先看空闲链，再改内存条') +
              opBanner(S[idx]) +
              fitView(S[idx]);
          }
        });
      })(i);
    }
    steps.push({
      caption: '最终已分配 ' + FIT.finalAlloc.map(function (a) { return a.size; }).join(' + ') + ' = ' + FIT.allocatedKB +
        'KB；内存利用率 = ' + FIT.allocatedKB + ' ÷ ' + FIT.memKB + ' ≈ ' + U.fmt1(FIT.utilization * 100) + '%。',
      dur: 7000,
      html: function () {
        return U.sceneHead('3.2 · 主线题', '最终状态与利用率') +
          '<div class="op-banner final"><span class="op-tag">最终</span><b>7 步操作完成</b></div>' +
          fitView(S[7]) +
          '<div class="util-card">' +
            '<div class="uc-row"><span>已分配</span><b>' + FIT.finalAlloc.map(function (a) { return a.size; }).join(' + ') +
              ' = ' + FIT.allocatedKB + ' KB</b></div>' +
            '<div class="uc-row"><span>内存利用率</span><b>' + FIT.allocatedKB + ' ÷ ' + FIT.memKB + ' = ' +
              U.fmt1(FIT.utilization * 100) + '%</b></div>' +
          '</div>' +
          say('最终空闲分区：' + FIT.finalFree.map(freeTxt).join(' 和 ') + '。');
      }
    });
    return {
      id: '3.2',
      short: '7步',
      title: '主线题：7 步操作',
      steps: steps
    };
  }

  /* ---------- 3.3 优缺点 + 三算法对比 ---------- */

  function cmpCards(chosenKey) {
    return '<div class="cmp-row">' + FREE.map(function (f, i) {
      var chosen = CMP[chosenKey] && CMP[chosenKey].start === f.start;
      return '<div class="cmp-card ' + (chosen ? 'on' : '') + '">' +
        '<div class="cmp-idx">块 ' + String.fromCharCode(65 + i) + '</div>' +
        '<div class="cmp-addr">起始 ' + f.start + '</div>' +
        '<div class="cmp-size">' + f.size + ' KB</div>' +
        '<div class="cmp-tag">' + (chosen ? '选中' : '') + '</div></div>';
    }).join('') + '</div>';
  }

  function sceneCompare() {
    return {
      id: '3.3',
      short: '对比',
      title: '优缺点与三种适应',
      steps: [
        {
          caption: '首次适应的优点：尽量保留高地址的大块连续空闲区，后面的大作业更容易放。',
          html: function () {
            return U.sceneHead('3.3 · 优缺点', '优点：高地址留大块') +
              U.memStrip(FIT.memKB, FIT.finalFree, FIT.finalAlloc) +
              U.callout('good', '看最终状态', '高地址的 ' + freeTxt(FIT.finalFree[1]) + ' 还有连续空间，大作业来了还能用。') +
              say('因为它总是从低地址开始找，先把低地址切碎，高地址的大块就保住了。');
          }
        },
        {
          caption: '缺点：低地址被反复切割，留下很多小碎片；越到后面，扫描经过的碎片越多。',
          html: function () {
            return U.sceneHead('3.3 · 优缺点', '缺点：低地址碎片多') +
              U.memStrip(FIT.memKB, FIT.finalFree, FIT.finalAlloc) +
              U.callout('bad', '碎片积累', freeTxt(FIT.finalFree[0]) + ' 单独看不起眼，但放不下大作业。每次申请都要从头扫过这些小碎片，效率变低。') +
              say('这就是“首次适应”的代价：实现简单，但低地址会越来越碎。');
          }
        },
        {
          caption: '15 秒补充对比：三个空闲块 ' + FREE.map(function (f) { return f.size; }).join('、') + 'KB，申请 ' + CMP.request + 'KB。首次适应选第一个够用的 ' + CMP.first.size + 'KB。',
          html: function () {
            return U.sceneHead('3.3 · 三种适应', '首次适应：第一个够用就行') +
              cmpCards('first') +
              say('从地址小的往大扫，第一个 ≥' + CMP.request + 'KB 的块就选中，不比较谁更合适。');
          }
        },
        {
          caption: '最佳适应：选最小的够用块，也就是 ' + CMP.best.size + 'KB 那块。',
          html: function () {
            return U.sceneHead('3.3 · 三种适应', '最佳适应：最小的够用块') +
              cmpCards('best') +
              say('把每个块都看一遍，选浪费最少的那块；代价是扫描更久，还容易留下更小的碎片。');
          }
        },
        {
          caption: '最坏适应：选最大的块，也就是 ' + CMP.worst.size + 'KB 那块。',
          html: function () {
            return U.sceneHead('3.3 · 三种适应', '最坏适应：最大的块') +
              cmpCards('worst') +
              say('选最大的块，切完剩下的部分还比较大，可能还能用；但大块很快会被用光。');
          }
        },
        {
          caption: '记住区别：首次适应找“第一个”，最佳适应找“最小够用”，最坏适应找“最大”。',
          html: function () {
            var rows = [
              ['首次适应', '第一个够用的块', CMP.first.size + 'KB'],
              ['最佳适应', '最小的够用块', CMP.best.size + 'KB'],
              ['最坏适应', '最大的块', CMP.worst.size + 'KB']
            ].map(function (r) {
              return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td class="num">' + r[2] + '</td></tr>';
            }).join('');
            return U.sceneHead('3.3 · 三种适应', '一张表记住') +
              '<table class="tbl"><thead><tr><th>算法</th><th>怎么选</th><th>本题选中</th></tr></thead><tbody>' + rows + '</tbody></table>' +
              say('考试如果只考首次适应，记住“从链首扫，第一个够大就用”。');
          }
        }
      ]
    };
  }

  /* ---------- 3.4 模板 ---------- */

  function tplItem(n, title, body) {
    return '<div class="tpl-item"><div class="tpl-num">' + n + '</div><div><b>' + title + '</b><p>' + body + '</p></div></div>';
  }

  function sceneTemplate() {
    return {
      id: '3.4',
      short: '模板',
      title: '解题模板',
      steps: [
        {
          caption: '模板前半段：每步先写空闲分区表，申请时从链首往下找第一个够大的。',
          html: function () {
            return U.sceneHead('3.4 · 解题模板', '申请与切分') +
              tplItem('1', '先画内存条和空闲链', '每个节点写（起始地址，大小），按地址从小到大排。') +
              tplItem('2', '申请：从链首扫描', '第一个大小 ≥ 申请量的节点就是目标。') +
              tplItem('3', '切分', '分配 [start, start+size)；剩余 [start+size, end)。正好相等就删掉节点。') +
              U.callout('info', '写题格式', '每一步都写出“操作 → 空闲分区表”，老师按步给分。');
          }
        },
        {
          caption: '模板后半段：释放时插回链中，检查左右邻居；最后用已分配量除以总量。',
          html: function () {
            return U.sceneHead('3.4 · 解题模板', '释放与利用率') +
              tplItem('4', '释放：按地址插回链', '插回后检查前、后两个节点是否与它相邻。') +
              tplItem('5', '相邻就合并', '起点和终点的地址正好接上，就把两个节点合成一个。') +
              tplItem('6', '算利用率', '利用率 = 已分配总量 ÷ 总内存，不是空闲量 ÷ 总量。') +
              U.callout('warn', '最常见的丢分点', '释放后忘记检查合并；分配后忘记改剩余块的起始地址。');
          }
        }
      ]
    };
  }

  function errRow(wrong, right) {
    return '<div class="err-row"><span class="err-badge">错</span><div><b>' + wrong + '</b><p>' + right + '</p></div></div>';
  }

  function sceneErrors() {
    return {
      id: '3.5',
      short: '易错',
      title: '常见错误',
      steps: [
        {
          caption: '第一类：释放不合并、分配不改起始地址、区间开闭算错。',
          html: function () {
            return U.sceneHead('3.5 · 常见错误', '链的维护') +
              errRow('释放后忘记合并', '本题 ' + S[6].op.name + '释放 ' + freeTxt(S[6].released) + '，必须和 ' + freeTxt(S[6].merges[0].other) + ' 合并成 ' + freeTxt(S[6].mergedBlock) + '。') +
              errRow('分配后只改大小，不改起始地址', '切掉前半段后，剩余块起点要往后挪：从 ' + S[1].allocated.start + ' 变成 ' + S[1].split.remain.start + '。') +
              errRow('区间“含不含终点”算错', '统一用左闭右开 [起, 止)，本题 ' + freeTxt(FIT.finalFree[0]) + ' 大小是 ' + (FIT.finalFree[0].start + FIT.finalFree[0].size) + '−' + FIT.finalFree[0].start + '=' + FIT.finalFree[0].size + '。');
          }
        },
        {
          caption: '第二类：扫描选错、算法混淆、利用率算反。',
          html: function () {
            return U.sceneHead('3.5 · 常见错误', '选择与计算') +
              errRow('首次适应跳过第一个够大的块', '首次适应必须用第一个够大的，不能挑“更合适”的。') +
              errRow('把首次适应当成最佳适应', '最佳适应才找最小够用块；首次只看顺序。') +
              errRow('利用率用空闲量除以总量', '利用率 = 已分配 ÷ 总量；本题 ' + FIT.allocatedKB + ' ÷ ' + FIT.memKB + '，不是 ' + FIT.freeKB + ' ÷ ' + FIT.memKB + '。') +
              errRow('忘记“释放后空出的块”也要参与后续分配', '释放的块回到链里，后面的申请可以再用它。');
          }
        }
      ]
    };
  }

  window.MODULES = window.MODULES || {};
  window.MODULES.m3 = {
    title: '首次适应',
    sub: '512KB 内存、7 步申请与释放：每步都画内存条和空闲链',
    scenes: [sceneStrip(), sceneRule(), sceneMain(), sceneCompare(), sceneTemplate(), sceneErrors()]
  };
})();

/* 模块④ 快表 TLB */
(function () {
  'use strict';
  var U = window.UI;
  var D = window.DATA;
  var T = D.tlb;
  var F = U.fmt;

  function say(t) { return '<div class="say">' + t + '</div>'; }

  function arch(hitPt, hitData, showTlb) {
    return '<div class="arch">' +
      '<div class="arch-row">' +
        '<div class="arch-box cpu">CPU<span>发出逻辑地址</span></div>' +
        (showTlb ? '<div class="arch-tie">⇄</div><div class="arch-box tlb on">TLB 快表<span>查一次 ' + T.tlbNs + 'ns</span></div>' : '') +
      '</div>' +
      '<div class="arch-arrow ' + (hitPt === true ? 'on' : '') + '">↓ 查页表</div>' +
      '<div class="arch-box pt ' + (hitPt === true ? 'on' : '') + '">主存里的页表<span>' + T.memNs + 'ns / 次</span></div>' +
      '<div class="arch-arrow ' + (hitData === true ? 'on' : '') + '">↓ 按块号取数据</div>' +
      '<div class="arch-box data ' + (hitData === true ? 'on' : '') + '">数据块<span>' + T.memNs + 'ns / 次</span></div>' +
      '</div>';
  }

  function tlRow(kind, showSaved) {
    var total = kind === 'hit' ? T.hitTime : T.missTime;
    var max = T.missTime;
    var segs = '<div class="tl-seg tlb" style="width:' + (T.tlbNs / total * 100) + '%">' + T.tlbNs + '</div>';
    if (kind === 'miss') {
      segs += '<div class="tl-seg page ' + (showSaved ? 'saved' : '') + '" style="width:' + (T.memNs / total * 100) + '%">查页表 ' + T.memNs + '</div>';
    }
    segs += '<div class="tl-seg mem" style="width:' + (T.memNs / total * 100) + '%">' +
      (kind === 'hit' ? '取数据 ' : '取数据 ') + T.memNs + '</div>';
    return '<div class="tl-row ' + kind + '">' +
      '<div class="tl-name"><b>' + (kind === 'hit' ? '命中' : '未命中') + '</b><span>' +
        (kind === 'hit' ? 'TLB 里有这一页' : 'TLB 里没有') + '</span></div>' +
      '<div class="tl-track"><div class="tl-bar" style="width:' + (total / max * 100) + '%">' + segs + '</div></div>' +
      '<div class="tl-total">' + total + 'ns</div>' +
      '</div>';
  }

  function sceneWhy() {
    return {
      id: '4.0',
      short: '为什么',
      title: '为什么需要快表',
      steps: [
        {
          caption: 'CPU 拿到逻辑地址，先去页表里查：这一页被放在哪个物理块。',
          html: function () {
            return U.sceneHead('4.0 场景', '访问数据的路线', '页表在主存里') +
              arch(false, false, false) +
              say('页表就是记着“哪一页在哪个块”的那张表。');
          }
        },
        {
          caption: '页表放在主存里，查一次页表就是访问一次内存，花 ' + T.memNs + 'ns。',
          html: function () {
            return U.sceneHead('4.0 场景', '第 1 次内存访问：查页表') +
              arch(true, false, false) +
              '<div class="big-result"><span>查页表</span><b>' + T.memNs + '</b><span>ns</span></div>' +
              say('这一步只是拿到块号，还没拿到真正想要的数据。');
          }
        },
        {
          caption: '再按块号去那个块取数据，又是第 2 次内存访问，再花 ' + T.memNs + 'ns。',
          html: function () {
            return U.sceneHead('4.0 场景', '第 2 次内存访问：取数据') +
              arch(true, true, false) +
              '<div class="big-result"><span>取数据</span><b>' + T.memNs + '</b><span>ns</span></div>' +
              say('一次取数据，实际访问了两次内存：先查表，再取数。');
          }
        },
        {
          caption: '所以不设快表：' + T.memNs + ' + ' + T.memNs + ' = ' + T.noTlb + 'ns。这就是要引入快表的原因。',
          dur: 6200,
          html: function () {
            return U.sceneHead('4.0 场景', '不设快表：100ns') +
              arch(true, true, false) +
              U.formula(T.memNs + ' + ' + T.memNs + ' = <b>' + T.noTlb + 'ns</b>', 'big') +
              U.callout('bad', '太慢了', '每次取数据都要查两遍内存。能不能把最近用过的页表项抄近一点？');
          }
        },
        {
          caption: '快表 TLB 是 CPU 旁边的一块很小很快的“小抄”，只记最近用过的页表项。',
          html: function () {
            return U.sceneHead('4.0 场景', '快表 TLB 是什么') +
              arch(false, false, true) +
              U.callout('good', '生活类比', '把常用电话号码抄进手机通讯录，就不用每次都翻厚厚的电话簿。TLB 就是那页通讯录。') +
              say('页表项就是页表里的一行：记着一页对应哪个块。TLB 很小，只能装几十到几百项，存的是这些页表项的副本。');
          }
        }
      ]
    };
  }

  function scenePaths() {
    return {
      id: '4.1',
      short: '两条路',
      title: '命中和未命中两条路',
      steps: [
        {
          caption: '命中：TLB 里有这一页，' + T.tlbNs + 'ns 查到块号，再花 ' + T.memNs + 'ns 取数据，共 ' + T.hitTime + 'ns。',
          dur: 6200,
          html: function () {
            return U.sceneHead('4.1 场景', '命中路径', 'TLB 命中') +
              tlRow('hit') +
              U.formula(T.tlbNs + ' + ' + T.memNs + ' = <b>' + T.hitTime + 'ns</b>', 'big') +
              U.legend([{ cls: 'sw tlb', label: '查 TLB' }, { cls: 'sw mem', label: '访问内存' }]) +
              say('只访问了一次内存：取数据。查 TLB 不算访问内存。');
          }
        },
        {
          caption: '未命中：先花 ' + T.tlbNs + 'ns 查 TLB，没查到；再花 ' + T.memNs + 'ns 查内存页表，最后 ' + T.memNs + 'ns 取数据，共 ' + T.missTime + 'ns。',
          dur: 6800,
          html: function () {
            return U.sceneHead('4.1 场景', '未命中路径', 'TLB 里没有，只能去内存查页表') +
              tlRow('miss') +
              U.formula(T.tlbNs + ' + ' + T.memNs + ' + ' + T.memNs + ' = <b>' + T.missTime + 'ns</b>', 'big') +
              U.legend([{ cls: 'sw tlb', label: '查 TLB' }, { cls: 'sw page', label: '查内存页表' }, { cls: 'sw mem', label: '取数据' }]) +
              say('未命中要访问两次内存：查页表 + 取数据。');
          }
        },
        {
          caption: '两条路摆在一起：命中省掉的是“查内存页表”那 ' + T.memNs + 'ns。',
          dur: 6500,
          html: function () {
            return U.sceneHead('4.1 场景', '对比：省掉哪一段') +
              tlRow('hit') +
              tlRow('miss', true) +
              U.callout('info', '看图', '未命中那条里标着“查页表”的 ' + T.memNs + 'ns，命中时被 TLB 里的副本替代了，所以只花 ' + T.hitTime + 'ns。') +
              say('两条时间轴按 ns 成比例画；TLB 的 5ns 段很短，看总长度即可。');
          }
        }
      ]
    };
  }

  function dots() {
    var s = '<div class="dot-grid">';
    for (var i = 0; i < 100; i++) {
      s += '<span class="dot ' + (i < Math.round(T.hit * 100) ? 'hit' : 'miss') + '"></span>';
    }
    return s + '</div>';
  }

  function chart() {
    var X0 = 50, X1 = 580, Y0 = 210, Y1 = 30;
    function x(h) { return X0 + h * (X1 - X0); }
    function y(v) { return Y0 - (v - 50) / 60 * (Y0 - Y1); }
    var h0 = 0, h1 = 1;
    var line = 'M' + x(0) + ',' + y(T.missTime) + ' L' + x(1) + ',' + y(T.hitTime);
    var noY = y(T.noTlb);
    var beX = x(T.breakEven);
    var startEat = T.eat;
    return '<svg class="eat-chart" viewBox="0 0 620 260" role="img" aria-label="有效访问时间随命中率变化">' +
      '<rect x="50" y="30" width="530" height="180" class="chart-bg"></rect>' +
      '<line x1="50" y1="210" x2="580" y2="210" class="axis"></line>' +
      '<line x1="50" y1="30" x2="50" y2="210" class="axis"></line>' +
      '<line x1="50" y1="' + noY + '" x2="580" y2="' + noY + '" class="no-tlb-line"></line>' +
      '<text x="576" y="' + (noY - 8) + '" class="chart-lab end">不设快表 ' + T.noTlb + 'ns</text>' +
      '<text x="580" y="228" class="chart-lab end">命中率 100%</text>' +
      '<text x="50" y="228" class="chart-lab">0%</text>' +
      '<text x="315" y="228" class="chart-lab mid">50%</text>' +
      '<text x="44" y="214" class="chart-lab end">50ns</text>' +
      '<text x="44" y="34" class="chart-lab end">110ns</text>' +
      '<path d="' + line + '" class="eat-line"></path>' +
      '<circle cx="' + beX + '" cy="' + noY + '" r="4" class="be-dot"></circle>' +
      '<text x="' + (beX + 8) + '" y="' + (noY + 18) + '" class="chart-lab be-label">临界 ' + U.fmt1(T.breakEven * 100) + '%</text>' +
      '<line class="guide" x1="' + x(T.hit) + '" y1="30" x2="' + x(T.hit) + '" y2="210"></line>' +
      '<circle class="marker" cx="' + x(T.hit) + '" cy="' + y(startEat) + '" r="7"></circle>' +
      '<text class="marker-lab" x="' + (x(T.hit) - 18) + '" y="' + (y(startEat) - 14) + '">' + U.fmt1(startEat) + 'ns</text>' +
      '</svg>';
  }

  function sceneAverage() {
    return {
      id: '4.2',
      short: '加权平均',
      title: '有效访问时间与滑块',
      steps: [
        {
          caption: '假设一共访问 100 次：' + T.hitCount + ' 次命中，' + T.missCount + ' 次未命中。',
          html: function () {
            return U.sceneHead('4.2 场景', '100 次访问的分布') +
              dots() +
              U.legend([{ cls: 'sw hit', label: '命中 ' + Math.round(T.hit * 100) + ' 次' }, { cls: 'sw miss', label: '未命中 ' + Math.round((1 - T.hit) * 100) + ' 次' }]) +
              say('命中率 80% 的意思是：100 次里大约 80 次能在 TLB 里直接找到。');
          }
        },
        {
          caption: '命中 ' + T.hitCount + ' 次 × ' + T.hitTime + 'ns = ' + F(T.hitCount * T.hitTime) + 'ns；未命中 ' + T.missCount + ' 次 × ' + T.missTime + 'ns = ' + F(T.missCount * T.missTime) + 'ns。',
          dur: 6500,
          html: function () {
            return U.sceneHead('4.2 场景', '把两条路的时间加起来') +
              '<div class="calc-cols">' +
                '<div class="calc-col hit"><b>命中 ' + T.hitCount + ' 次</b><span>' + T.hitCount + ' × ' + T.hitTime + ' = ' + F(T.hitCount * T.hitTime) + ' ns</span></div>' +
                '<div class="calc-col miss"><b>未命中 ' + T.missCount + ' 次</b><span>' + T.missCount + ' × ' + T.missTime + ' = ' + F(T.missCount * T.missTime) + ' ns</span></div>' +
              '</div>' +
              U.formula(F(T.hitCount * T.hitTime) + ' + ' + F(T.missCount * T.missTime) + ' = <b>' + F(T.total100) + ' ns</b>', 'big') +
              say('总时间 6500ns 是 100 次访问的总和。');
          }
        },
        {
          caption: '平均每次 = ' + F(T.total100) + ' ÷ 100 = ' + U.fmt1(T.eat) + 'ns。这个平均值就叫“有效访问时间”（EAT）。',
          dur: 6500,
          html: function () {
            return U.sceneHead('4.2 场景', '有效访问时间 EAT') +
              U.formula(F(T.total100) + ' ÷ 100 = <b>' + U.fmt1(T.eat) + 'ns</b>', 'big') +
              '<div class="big-result"><span>EAT</span><b>' + U.fmt1(T.eat) + '</b><span>ns / 次</span></div>' +
              U.callout('info', '大白话', '有效访问时间就是“平均每次访问数据要花多少时间”，把命中和未命中按比例平均。') +
              say('不用真的访问 100 次，用加权平均就能算。');
          }
        },
        {
          caption: '公式：EAT = 命中率 × (TLB + 内存) + (1 − 命中率) × (TLB + 2 × 内存)。',
          dur: 6800,
          html: function () {
            return U.sceneHead('4.2 场景', '把过程写成公式') +
              U.formula('EAT = h × (t + m) + (1 − h) × (t + 2m)', 'big') +
              '<div class="var-table">' +
                '<span><b>h</b> 命中率 = ' + T.hit + '</span>' +
                '<span><b>t</b> 查 TLB 时间 = ' + T.tlbNs + 'ns</span>' +
                '<span><b>m</b> 一次内存 = ' + T.memNs + 'ns</span>' +
              '</div>' +
              U.formula(U.fmt1(T.hit) + ' × (' + T.tlbNs + '+' + T.memNs + ') + ' + U.fmt1(1 - T.hit) + ' × (' + T.tlbNs + '+2×' + T.memNs + ') = <b>' + U.fmt1(T.eat) + 'ns</b>') +
              say('记住括号里的意思：命中 1 次内存，未命中 2 次内存，但都要先查 TLB。');
          }
        },
        {
          caption: '试卷写法：' + T.memNs + ' + ' + T.tlbNs + '×' + U.fmt1(T.hit) + ' + (' + T.memNs + '+' + T.tlbNs + ')×' + U.fmt1(1 - T.hit) + ' = ' + U.fmt1(T.exam) + '，和上面的公式等价。',
          html: function () {
            return U.sceneHead('4.2 场景', '试卷上的写法') +
              U.formula(T.memNs + ' + ' + T.tlbNs + '×' + U.fmt1(T.hit) + ' + (' + T.memNs + '+' + T.tlbNs + ')×' + U.fmt1(1 - T.hit) + ' = <b>' + U.fmt1(T.exam) + '</b>', 'big') +
              U.callout('info', '两种写法一样', '试卷写法把“每次都有的 ' + T.memNs + 'ns 取数据”提出来，再加 TLB 的加权时间；代数上和 EAT 公式完全等价。') +
              say('考试用哪种都行，写清楚 h、t、m 各是多少。');
          }
        },
        {
          caption: '拖动滑块看命中率变化：0% 时 ' + T.missTime + 'ns，100% 时 ' + T.hitTime + 'ns；不设快表固定 ' + T.noTlb + 'ns。',
          dur: 8000,
          html: function () {
            return U.sceneHead('4.2 场景', '互动：改变命中率') +
              '<div class="slider-card">' +
                '<div class="slider-top"><span>命中率 h</span><b class="h-val">' + Math.round(T.hit * 100) + '%</b></div>' +
                '<input class="h-slider" type="range" min="0" max="100" step="1" value="' + Math.round(T.hit * 100) + '" aria-label="命中率">' +
                '<div class="slider-mid">' +
                  '<span>命中 <b>' + T.hitTime + 'ns</b></span>' +
                  '<span>未命中 <b>' + T.missTime + 'ns</b></span>' +
                  '<span class="eat-now">EAT <b class="eat-val">' + U.fmt1(T.eat) + 'ns</b></span>' +
                '</div>' +
              '</div>' +
              chart() +
              '<div class="slider-note">不设快表的 100ns 线在图上；命中率高于 <b>' + U.fmt1(T.breakEven * 100) + '%</b> 时，快表才开始划算。</div>';
          },
          enter: function (root) {
            var input = root.querySelector('.h-slider');
            var marker = root.querySelector('.marker');
            var lab = root.querySelector('.marker-lab');
            var guide = root.querySelector('.guide');
            var hval = root.querySelector('.h-val');
            var eval_ = root.querySelector('.eat-val');
            if (!input || !marker) return;
            function x(h) { return 50 + h * 530; }
            function y(v) { return 210 - (v - 50) / 60 * 180; }
            function update() {
              var h = Number(input.value) / 100;
              var eat = h * T.hitTime + (1 - h) * T.missTime;
              hval.textContent = Math.round(h * 100) + '%';
              eval_.textContent = eat.toFixed(1) + 'ns';
              marker.setAttribute('cx', x(h));
              marker.setAttribute('cy', y(eat));
              lab.setAttribute('x', x(h) - 18);
              lab.setAttribute('y', y(eat) - 14);
              lab.textContent = eat.toFixed(1) + 'ns';
              guide.setAttribute('x1', x(h));
              guide.setAttribute('x2', x(h));
            }
            input.addEventListener('input', update);
            update();
          }
        }
      ]
    };
  }

  function tplItem(n, title, body) {
    return '<div class="tpl-item"><div class="tpl-num">' + n + '</div><div><b>' + title + '</b><p>' + body + '</p></div></div>';
  }

  function sceneTemplate() {
    return {
      id: '4.3',
      short: '模板',
      title: '解题模板',
      steps: [
        {
          caption: '模板前半段：先写清两条路径各自花多少时间。',
          html: function () {
            return U.sceneHead('4.3 · 解题模板', '两条路径') +
              tplItem('1', '命中路径', '查 TLB + 取数据 = t + m = ' + T.hitTime + 'ns。') +
              tplItem('2', '未命中路径', '查 TLB + 查页表 + 取数据 = t + 2m = ' + T.missTime + 'ns。') +
              tplItem('3', '不设快表', '查页表 + 取数据 = 2m = ' + T.noTlb + 'ns。') +
              U.callout('info', '先列三行', '不管题目怎么问，先把 ' + T.hitTime + '、' + T.missTime + '、' + T.noTlb + ' 这三个数写出来，后面不会乱。');
          }
        },
        {
          caption: '模板后半段：按命中率加权，套 EAT 公式。',
          html: function () {
            return U.sceneHead('4.3 · 解题模板', '加权平均') +
              tplItem('4', '套公式', 'EAT = h × (t + m) + (1 − h) × (t + 2m)。') +
              tplItem('5', '代入', 'h = ' + T.hit + '，t = ' + T.tlbNs + '，m = ' + T.memNs + '，得 ' + U.fmt1(T.eat) + 'ns。') +
              tplItem('6', '检查', '结果一定在命中时间 ' + T.hitTime + ' 和未命中时间 ' + T.missTime + ' 之间。') +
              U.callout('warn', '单位', '题目给 ns 就用 ns，最后别漏单位。');
          }
        }
      ]
    };
  }

  function errRow(wrong, right) {
    return '<div class="err-row"><span class="err-badge">错</span><div><b>' + wrong + '</b><p>' + right + '</p></div></div>';
  }

  function sceneErrors() {
    return {
      id: '4.4',
      short: '易错',
      title: '常见错误与口径',
      steps: [
        {
          caption: '第一类：未命中时漏掉查 TLB 的 ' + T.tlbNs + 'ns，或者漏掉最后取数据的 ' + T.memNs + 'ns。',
          html: function () {
            return U.sceneHead('4.4 · 常见错误', '路径漏项') +
              errRow('未命中只算 ' + T.memNs + ' + ' + T.memNs + ' = ' + (2 * T.memNs) + 'ns', '先查 TLB ' + T.tlbNs + 'ns，再查页表 ' + T.memNs + 'ns，再取数据 ' + T.memNs + 'ns，是 ' + T.missTime + 'ns。') +
              errRow('未命中忘记最后取数据', '查完页表只是拿到块号，还要去那个块取数据。') +
              errRow('命中时把 TLB 的 ' + T.tlbNs + 'ns 漏掉', '命中路径是 ' + T.tlbNs + ' + ' + T.memNs + ' = ' + T.hitTime + 'ns。');
          }
        },
        {
          caption: '第二类：权重弄反、把 ' + T.noTlb + 'ns 当答案、不同教材口径不同。',
          html: function () {
            return U.sceneHead('4.4 · 常见错误', '加权与口径') +
              errRow('把 0.8 乘到未命中上', '命中率乘命中时间，1 − 命中率乘未命中时间。') +
              errRow('不设快表也写 ' + U.fmt1(T.eat) + 'ns', '不设快表是 2 × ' + T.memNs + ' = ' + T.noTlb + 'ns，' + U.fmt1(T.eat) + 'ns 是设了快表后的平均值。') +
              errRow('不知道 TLB 未命中要不要算 ' + T.tlbNs + 'ns', '本课程约定：算。未命中 = ' + T.tlbNs + ' + ' + T.memNs + ' + ' + T.memNs + ' = ' + T.missTime + 'ns。') +
              U.callout('warn', '一句提醒', '不同教材对“未命中是否计入 TLB 查找时间”有不同约定；本课程试卷计入，以本页为准。');
          }
        }
      ]
    };
  }

  window.MODULES = window.MODULES || {};
  window.MODULES.m4 = {
    title: '快表 TLB',
    sub: '5ns 查 TLB、80% 命中：从两条路径到 65ns 的加权平均',
    scenes: [sceneWhy(), scenePaths(), sceneAverage(), sceneTemplate(), sceneErrors()]
  };
})();


/* ===== m5.js ===== */
/* 模块⑤ 复盘与自测 */
(function () {
  'use strict';
  var U = window.UI;
  var D = window.DATA;
  var F = U.fmt;
  var T = D.tests;

  function sol(n, body) {
    return '<div class="sol-step"><span class="ss-n">' + n + '</span><div class="ss-body">' + body + '</div></div>';
  }

  function qCard(id, type, title, question, answer) {
    return '<article class="q-card" data-q="' + id + '">' +
      '<div class="q-head"><span class="q-tag">' + id + '</span><span class="q-type">' + type + '</span></div>' +
      '<h3 class="q-title">' + title + '</h3>' +
      '<div class="q-body">' + question + '</div>' +
      '<button class="reveal" data-reveal="' + id + '" aria-expanded="false" aria-controls="ans-' + id + '">看答案</button>' +
      '<div class="q-ans" id="ans-' + id + '" hidden>' + answer + '</div>' +
      '</article>';
  }

  function formulaSheet() {
    var inode = D.inode;
    var A = D.pagingA;
    var B = D.pagingB;
    return '<section class="formula-sheet" id="formulaSheet">' +
      '<div class="fs-head"><div><h3>一页纸公式卡</h3><p>4 个考点 · 考前 10 分钟看这一页</p></div>' +
        '<span class="fs-badge">可截图 / 可打印</span></div>' +
      '<div class="fs-grid">' +

      '<div class="fs-block fs-m1">' +
        '<div class="fs-title"><span>①</span>文件索引（inode）</div>' +
        '<div class="fs-line"><b>p</b> = 块大小 ÷ 地址项大小</div>' +
        '<div class="fs-line">容量 = 直接 n + 一级 p + 二级 p² + 三级 p³</div>' +
        '<div class="fs-line">最大文件 = 总块数 × 块大小</div>' +
        '<div class="fs-line">块号 = 偏移 ÷ 块大小；余数 = 块内偏移</div>' +
        '<div class="fs-line">读盘（inode 在内存）：直接 1 / 一级 2 / 二级 3 / 三级 4</div>' +
        '<div class="fs-line">实际占用 = 数据块 + 索引块（别漏）</div>' +
        '<div class="fs-ex">本卷：p = ' + inode.layout.p + '；最大 ' + F(inode.layout.totalBlocks) + ' 块 ≈ ' +
          U.fmt2(inode.layout.maxMB) + 'MB；偏移 80000 → 块 ' + inode.blockIndex + '，读 ' + inode.access.reads +
          ' 次；1MB → ' + F(inode.usage.totalBlocks) + ' 块。</div>' +
      '</div>' +

      '<div class="fs-block fs-m2">' +
        '<div class="fs-title"><span>②</span>分页地址变换</div>' +
        '<div class="fs-line">页内位数 = log₂(页大小)；页号位数 = 总位数 − 页内位数</div>' +
        '<div class="fs-line">页号 = 地址 ÷ 页大小；页内偏移 = 余数</div>' +
        '<div class="fs-line">物理地址 = 块号 × 页大小 + 页内偏移</div>' +
        '<div class="fs-line">十六进制：展开成二进制，按 4 位一组切</div>' +
        '<div class="fs-line">页号 ≥ 页表长度 → 越界中断</div>' +
        '<div class="fs-ex">本卷：2800 → 页 ' + A.page + '，偏移 ' + A.offset + ' → 物理地址 ' + F(A.pa) + ' = ' + A.paHex +
          'H；0CA8H → ' + B.paHex + 'H。</div>' +
        '<div class="fs-warn">易错：页内偏移变换前后必须不变。</div>' +
      '</div>' +

      '<div class="fs-block fs-m3">' +
        '<div class="fs-title"><span>③</span>首次适应</div>' +
        '<div class="fs-line">空闲链按起始地址从小到大排</div>' +
        '<div class="fs-line">申请：从链首扫，第一个 ≥ 申请量的块就用</div>' +
        '<div class="fs-line">切分：分配 [start, start+size)，剩余 [start+size, end)</div>' +
        '<div class="fs-line">释放：按地址插回链，检查左右邻居，相邻就合并</div>' +
        '<div class="fs-line">利用率 = 已分配总量 ÷ 总内存</div>' +
        '<div class="fs-ex">本卷：最终空闲 [70,160) 90KB、[390,512) 122KB；利用率 ' +
          F(D.fit.allocatedKB) + ' ÷ ' + D.fit.memKB + ' ≈ ' + U.fmt1(D.fit.utilization * 100) + '%。</div>' +
        '<div class="fs-warn">易错：释放忘合并；分配忘改剩余块起点。</div>' +
      '</div>' +

      '<div class="fs-block fs-m4">' +
        '<div class="fs-title"><span>④</span>快表 TLB</div>' +
        '<div class="fs-line">命中 = t + m = ' + D.tlb.hitTime + 'ns</div>' +
        '<div class="fs-line">未命中 = t + 2m = ' + D.tlb.missTime + 'ns</div>' +
        '<div class="fs-line">不设快表 = 2m = ' + D.tlb.noTlb + 'ns</div>' +
        '<div class="fs-line"><b>EAT</b> = h(t+m) + (1−h)(t+2m)</div>' +
        '<div class="fs-line">试卷写法：m + t·h + (m+t)(1−h)，等价</div>' +
        '<div class="fs-ex">本卷：h = ' + D.tlb.hit + '，t = ' + D.tlb.tlbNs + 'ns，m = ' + D.tlb.memNs +
          'ns → EAT = ' + U.fmt1(D.tlb.eat) + 'ns。</div>' +
        '<div class="fs-warn">易错：未命中漏掉 t 或最后一次 m；权重乘反。</div>' +
      '</div>' +

      '</div>' +
      '<div class="fs-foot">打印时只会保留这一页公式卡。自测题在下方，答案默认收起。</div>' +
      '</section>';
  }

  function tests() {
    var A1 = T.A1, A2 = T.A2, B1 = T.B1, B2 = T.B2, C1 = T.C1, D1 = T.D1;

    var a1Range =
      '<div class="mini-axis">' +
        '<div class="ma direct" style="width:8%">0–9</div>' +
        '<div class="ma single" style="width:24%">10–' + (A1.access.region.start - 1) + '</div>' +
        '<div class="ma double" style="width:68%">' + A1.access.region.start + '–' + (A1.layout.totalBlocks - 1) + '</div>' +
        '<div class="ma-mark" style="left:' + (8 + 24 + 68 * ((A1.byteBlock - A1.access.region.start + 0.5) / A1.access.region.count)).toFixed(2) + '%">' +
          '<span>' + A1.byteBlock + '</span></div>' +
      '</div>' +
      '<div class="mini-axis-note">示意：292 刚进二级区，离起点 26 块。</div>';

    var a1Ans =
      sol(1, '<b>p</b> = ' + A1.cfg.blockSize + ' ÷ ' + A1.cfg.ptrSize + ' = <b>' + A1.layout.p + '</b> 项/块') +
      sol(2, '最大文件 = ' + A1.cfg.nDirect + ' + ' + A1.layout.p + ' + ' + A1.layout.p + '² = <b>' +
        F(A1.layout.totalBlocks) + '</b> 块<br>= ' + F(A1.layout.maxBytes / 1024) + ' KB ≈ <b>' +
        U.fmt2(A1.layout.maxMB) + ' MB</b>') +
      sol(3, '300000 ÷ ' + A1.cfg.blockSize + ' = <b>' + A1.byteBlock + '</b> 余 <b>' + A1.blockOffset + '</b>') +
      sol(4, '直接 0–9，一级 10–' + (A1.access.region.start - 1) + '，二级从 ' + A1.access.region.start +
        ' 起；' + A1.byteBlock + ' 在二级区 → 读 <b>' + A1.access.reads + ' 次</b>盘') +
      '<div class="final-answer"><span>答案</span>(1) ' + F(A1.layout.maxBytes / 1024) + ' KB（≈ ' +
        U.fmt2(A1.layout.maxMB) + ' MB）；(2) ' + A1.access.reads + ' 次</div>' + a1Range;

    var a2Ans =
      sol(1, '<b>p</b> = ' + A2.cfg.blockSize + ' ÷ ' + A2.cfg.ptrSize + ' = <b>' + A2.layout.p + '</b> 项/块') +
      sol(2, '最大 = ' + A2.cfg.nDirect + ' + 2 × ' + A2.layout.p + ' + ' + A2.layout.p + '²<br>= ' +
        A2.cfg.nDirect + ' + ' + (2 * A2.layout.p) + ' + ' + F(A2.layout.p * A2.layout.p) + ' = <b>' +
        F(A2.layout.totalBlocks) + '</b> 块') +
      sol(3, '每块 1KB → 最大文件 = <b>' + F(A2.layout.maxBytes / 1024) + ' KB</b>') +
      '<div class="final-answer"><span>答案</span>' + F(A2.layout.totalBlocks) + ' KB（' + F(A2.layout.totalBlocks) + ' 个 1KB 块）</div>';

    var b1Ans =
      sol(1, '3000 ÷ ' + B1.pageSize + ' = <b>' + B1.page + '</b> 余 <b>' + B1.offset + '</b>') +
      sol(2, '页 ' + B1.page + ' → 块 ' + B1.frame + '（查页表）') +
      sol(3, '物理地址 = ' + B1.frame + ' × ' + B1.pageSize + ' + ' + B1.offset + ' = <b>' + B1.pa + '</b>') +
      '<div class="final-answer"><span>答案</span>' + B1.pa + '</div>';

    var b2Ans =
      sol(1, '4KB = 2¹² → 页内偏移 12 位 = 十六进制低 3 位。<br>2B7CH 拆成：页号 <b>2</b>，偏移 <b>' + B2.offsetHex + 'H</b>') +
      sol(2, '页 2 → 块 9（十六进制 <b>' + B2.frameHex + '</b>）') +
      sol(3, '块号替换页号，偏移不动：<b>' + B2.frameHex + '</b> + <b>' + B2.offsetHex + '</b> = <b>' + B2.paHex + 'H</b>') +
      '<div class="hex-split"><span class="hxs">2</span><span class="hxs off">B7C</span>' +
        '<span class="hxs-ar">→</span><span class="hxs frame">9</span><span class="hxs off">B7C</span></div>' +
      '<div class="final-answer"><span>答案</span>' + B2.paHex + 'H</div>';

    var c1Rows = C1.snapshots.slice(1).map(function (s) {
      var op = s.op.type === 'alloc' ? s.op.name + ' 申请 ' + s.op.size : s.op.name + ' 释放';
      var free = s.free.map(function (f) {
        return '[' + f.start + ',' + (f.start + f.size) + ') ' + f.size + 'K';
      }).join('、');
      return '<tr><td>' + op + '</td><td>' + free + '</td></tr>';
    }).join('');

    var c1Ans =
      '<div class="sol-table-wrap"><table class="tbl compact"><thead><tr><th>操作</th><th>操作后的空闲分区</th></tr></thead><tbody>' +
        c1Rows + '</tbody></table></div>' +
      '<div class="mini-mem">' + U.memStrip(C1.memKB, C1.finalFree, C1.finalAlloc) + '</div>' +
      sol(1, '最终空闲：' + C1.finalFree.map(function (f) {
        return '[' + f.start + ',' + (f.start + f.size) + ') <b>' + f.size + 'KB</b>';
      }).join('、')) +
      sol(2, '已分配 = ' + C1.finalAlloc.map(function (a) { return a.size; }).join(' + ') + ' = <b>' +
        C1.allocatedKB + ' KB</b>') +
      sol(3, '利用率 = ' + C1.allocatedKB + ' ÷ ' + C1.memKB + ' = <b>' +
        U.fmt1(C1.utilization * 100) + '%</b>') +
      '<div class="final-answer"><span>答案</span>空闲 [0,90) 90KB、[130,140) 10KB、[360,400) 40KB；利用率 ' +
        U.fmt1(C1.utilization * 100) + '%</div>';

    var d1Ans =
      sol(1, '命中：' + D1.memNs + ' + ' + D1.tlbNs + ' = <b>' + D1.hitTime + 'ns</b>；未命中：' +
        D1.tlbNs + ' + 2×' + D1.memNs + ' = <b>' + D1.missTime + 'ns</b>') +
      sol(2, 'EAT = ' + D1.hit + ' × ' + D1.hitTime + ' + ' + U.fmt1(1 - D1.hit) + ' × ' + D1.missTime +
        ' = <b>' + U.fmt1(D1.eat) + 'ns</b>') +
      sol(3, '不设快表 = 2 × ' + D1.memNs + ' = <b>' + D1.noTlb + 'ns</b>') +
      '<div class="final-answer"><span>答案</span>有效访问时间 ' + U.fmt1(D1.eat) + 'ns；不设快表 ' + D1.noTlb + 'ns</div>';

    return '<section class="selftest">' +
      '<div class="st-head"><div><h3>自测 · 先自己做，再点看答案</h3>' +
        '<p>6 道题覆盖 4 个考点。答案默认收起，先拿纸算一遍。</p></div>' +
        '<span class="st-progress">已看 <b>0</b> / 6</span></div>' +
      '<div class="q-grid">' +

      qCard('A1', '文件索引', '块 1KB、地址项 4B，10 直接 + 1 一级 + 1 二级',
        '<p>(1) 最大文件多大？</p><p>(2) 访问偏移 300000 字节，inode 在内存，要读几次盘？</p>', a1Ans) +

      qCard('A2', '文件索引', '5 直接 + 2 一级 + 1 二级，地址项 8B',
        '<p>块大小 1KB，每个地址项 8B。最大文件多大？</p>', a2Ans) +

      qCard('B1', '地址变换', '页大小 1KB，逻辑地址 3000',
        '<p>页表：页 0 → 块 5，页 1 → 块 2，页 2 → 块 7。</p><p>逻辑地址 3000（十进制）的物理地址是多少？</p>', b1Ans) +

      qCard('B2', '地址变换', '页大小 4KB，逻辑地址 2B7CH',
        '<p>页 2 → 块 9。物理地址用十六进制表示是多少？</p>', b2Ans) +

      qCard('C1', '首次适应', '400KB 内存，7 步申请与释放',
        '<p>依次：A 申请 90，B 申请 50，C 申请 120，B 释放，D 申请 40，A 释放，E 申请 100。</p>' +
        '<p>画出最终空闲分区，并求内存利用率。</p>', c1Ans) +

      qCard('D1', '快表 TLB', '内存 100ns，TLB 10ns，命中率 90%',
        '<p>有效访问时间是多少？不设快表是多少？</p>', d1Ans) +

      '</div></section>';
  }

  function renderReview(root) {
    root.innerHTML =
      '<div class="review-head"><div><span class="module-badge">模块 5</span>' +
        '<h2>复盘与自测</h2><p>一页纸公式卡 + 6 道自测。先算，再对答案。</p></div>' +
        '<button class="print-btn" id="printSheet" type="button">打印 / 存 PDF</button></div>' +
      formulaSheet() + tests();

    var revealBtns = Array.prototype.slice.call(root.querySelectorAll('[data-reveal]'));
    revealBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('.q-card');
        var ans = card.querySelector('.q-ans');
        var open = ans.hasAttribute('hidden');
        if (open) {
          ans.removeAttribute('hidden');
          btn.textContent = '收起答案';
          btn.classList.add('open');
        } else {
          ans.setAttribute('hidden', '');
          btn.textContent = '看答案';
          btn.classList.remove('open');
        }
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        updateProgress(root);
      });
    });

    var pb = root.querySelector('#printSheet');
    if (pb) {
      pb.addEventListener('click', function () {
        document.body.classList.add('print-sheet');
        window.print();
      });
    }
    window.addEventListener('afterprint', function () {
      document.body.classList.remove('print-sheet');
    });
  }

  function updateProgress(root) {
    var total = root.querySelectorAll('.q-card').length;
    var open = 0;
    Array.prototype.forEach.call(root.querySelectorAll('.q-ans'), function (a) {
      if (!a.hasAttribute('hidden')) open++;
    });
    var el = root.querySelector('.st-progress b');
    if (el) el.textContent = open;
    var box = root.querySelector('.st-progress');
    if (box && open === total) box.classList.add('done');
  }

  window.renderReview = renderReview;
})();


/* ===== app.js ===== */
/* 页签、主题、键盘与初始化 */
(function () {
  'use strict';
  var U = window.UI;
  var MODS = window.MODULES;
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('.module'));
  var players = {};
  var activeId = 'm1';
  var m5Rendered = false;
  var nums = { m1: '1', m2: '2', m3: '3', m4: '4' };

  function activate(id) {
    if (!document.getElementById(id)) id = 'm1';
    if (id === activeId && (players[id] || (id === 'm5' && m5Rendered))) return;
    if (players[activeId]) players[activeId].pause();
    activeId = id;
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-tab') === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) {
        var bar = t.parentElement;
        bar.scrollLeft = t.offsetLeft - bar.clientWidth / 2 + t.offsetWidth / 2;
      }
    });
    sections.forEach(function (s) {
      s.classList.toggle('active', s.id === id);
    });
    try { history.replaceState(null, '', '#' + id); } catch (err) { /* file:// 下可能失败，忽略 */ }
    window.scrollTo({ top: 0, behavior: 'smooth' });

    if (id === 'm5') {
      if (!m5Rendered) {
        window.renderReview(document.getElementById('m5'));
        m5Rendered = true;
      }
      return;
    }
    if (!players[id]) {
      players[id] = U.createModule(document.getElementById(id), MODS[id], nums[id]);
      players[id].goToScene(0, { autoplay: true });
    }
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { activate(t.getAttribute('data-tab')); });
  });

  window.addEventListener('hashchange', function () {
    var id = location.hash.replace('#', '');
    if (id && id !== activeId) activate(id);
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(tag) || (e.target && e.target.isContentEditable)) return;
    var p = players[activeId];
    if (!p) return;
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      p.toggle();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      p.prev();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      p.next();
    }
  });

  var themeBtn = document.getElementById('themeBtn');
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('os-theme', theme); } catch (err) { /* ignore */ }
    if (themeBtn) {
      themeBtn.innerHTML = theme === 'dark' ? '☀ 浅色' : '◐ 深色';
      themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
    }
  }
  var saved = null;
  try { saved = localStorage.getItem('os-theme'); } catch (err) { /* ignore */ }
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  var initial = location.hash.replace('#', '');
  if (['m1', 'm2', 'm3', 'm4', 'm5'].indexOf(initial) < 0) initial = 'm1';
  activate(initial);
})();

</script>
